<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Untitled UI Skill Starter</title>
<link rel="stylesheet" href="../data/tokens-runtime.css"><link rel="stylesheet" href="../data/semantic.css">
<style>
*,*::before,*::after{box-sizing:border-box}body{font:400 var(--ds-text-md)/1.5 var(--ds-font);background:var(--ds-bg-subtle);color:var(--ds-text);margin:0;padding:var(--ds-space-8)}main{max-width:740px;margin:auto;background:var(--ds-bg);border:1px solid var(--ds-border);border-radius:var(--ds-radius-xl);padding:var(--ds-space-8)}h1{margin:0 0 8px}p{color:var(--ds-text-muted)}label{display:block;font-size:var(--ds-text-sm);font-weight:600;margin:0 0 6px}input{font:inherit;width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--ds-border);border-radius:var(--ds-radius-md);background:var(--ds-bg);color:var(--ds-text)}button{font:600 var(--ds-text-sm)/1 var(--ds-font);min-height:42px;padding:12px 18px;border-radius:var(--ds-radius-md);border:1px solid transparent;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--ds-ring);outline-offset:2px}.primary{background:var(--ds-brand);color:var(--ds-on-brand)}.primary:hover{background:var(--ds-brand-hover)}.secondary{background:var(--ds-bg);border-color:var(--ds-border);color:var(--ds-text)}.row{display:flex;gap:var(--ds-space-2);flex-wrap:wrap;margin-top:var(--ds-space-6)}#message{font-size:var(--ds-text-sm);min-height:20px} @media(max-width:600px){body{padding:var(--ds-space-4)}main{padding:var(--ds-space-4)}}
</style></head>
<body><main><h1>Starter UI</h1><p>Functional HTML example using tokens from Untitled UI v6.0 Figma. Not an exact Figma component export.</p>
<form id="f"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"><div class="row"><button class="primary" type="submit">Continue</button><button class="secondary" type="button" id="theme">Toggle dark theme</button></div><p id="message" role="status" aria-live="polite"></p></form></main>
<script>document.getElementById('theme').addEventListener('click',()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark');document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('message').textContent='Ready to continue: '+document.getElementById('email').value;});</script></body></html>
