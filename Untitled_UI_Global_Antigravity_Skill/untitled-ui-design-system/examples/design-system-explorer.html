function ico(name,size=17){return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[name]||icons.box}</svg>`}

 'Colors':'Primitive, semantic, and component color tokens for light and dark interfaces.',

const intro=(eyebrow,title,sub)=>`<div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p class="lede">${esc(sub)}</p>`;

function copyText(str){
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(str).then(()=>toast('Copied to clipboard')).catch(()=>legacyCopy(str));else legacyCopy(str);
}
function downloadFile(filename,contents,mime){
 const blob=new Blob([contents],{type:mime});const url=URL.createObjectURL(blob);const el=document.createElement('a');el.href=url;el.download=filename;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function exportCSS(){
 const variables=tokens.filter(t=>t.light!==null&&t.light!==undefined);
 const css='/* Untitled UI PRO v6.0: source-derived tokens */\n:root {\n'+variables.map(t=>'  '+t.cssName+': '+t.light+';').join('\n')+'\n}\n[data-theme="dark"] {\n'+variables.filter(t=>t.dark!==null&&t.dark!==undefined&&t.dark!==t.light).map(t=>'  '+t.cssName+': '+t.dark+';').join('\n')+'\n}\n';
 downloadFile('untitled-ui-tokens.css',css,'text/css');
}
function legacyCopy(str){const el=document.createElement('textarea');el.value=str;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('Copied to clipboard')}catch(e){toast('Copy is unavailable in this browser')}el.remove()}
function toast(message){let el=document.createElement('div');el.className='toast';el.innerHTML=`<span class="toast-symbol">${ico('check',17)}</span><span>${esc(message)}</span>`;toastRoot.appendChild(el);setTimeout(()=>el.remove(),3100)}
function token(name,mode='light'){return tokens.find(t=>t.name===name)?.[mode]||null}
function listToken(starts){return tokens.filter(t=>t.name.startsWith(starts))}
function pageLink(id,label,iconName,count){return `<a href="#${encodeURIComponent(id)}" data-route="${esc(id)}" class="nav-link ${state.page===id?'active':''}">${ico(iconName,16)}<span>${esc(label)}</span>${count!=null?`<span class="nav-num">${count}</span>`:''}</a>`}

 const groups=['Foundations','Shared components','Application UI','Marketing & examples'];
 let html=`<div class="nav-group"><div class="nav-caption">Workspace</div>${pageLink('overview','Overview','grid')}${pageLink('catalog','Component catalog','components')}${pageLink('variables','All variables','palette',tokens.length)}</div>`;
 for(const gr of groups){const all=pages.filter(p=>p.group===gr);html+=`<div class="nav-group"><div class="nav-caption">${esc(gr)} <span>${all.length}</span></div>${all.map(p=>pageLink(p.id,p.name,dynamicPageIcon(p.name))).join('')}</div>`}
 nav.innerHTML=html;

}
function navigate(id){if(!(['overview','catalog','variables'].includes(id)||pages.some(p=>p.id===id)))id='overview';state.page=id;state.preview='preview';window.location.hash=encodeURIComponent(id);render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('sidebar').classList.remove('open');root.innerHTML=''}
function render(){
 document.body.dataset.theme=state.theme;
 document.getElementById('theme-icon').textContent=state.theme==='dark'?'☼':'☾';
 const pg=pages.find(p=>p.id===state.page);document.getElementById('crumb-section').textContent=pg?pg.name:state.page==='overview'?'Overview':state.page==='catalog'?'Component catalog':'All variables';
 renderNav();
 main.innerHTML=state.page==='overview'?renderOverview():state.page==='catalog'?renderCatalog():state.page==='variables'?renderVariables():renderPage(pg);

 return `
 <div class="hero"><div><div class="eyebrow">DESIGN LIBRARY · FIGMA SOURCE</div><h1>Build with confidence.<br>Design with consistency.</h1><p>Explore a browsable HTML reference for Untitled UI PRO Variables v6.0. Inspect source-derived tokens, preview interactions, and reuse the code in your next build.</p>${actionBtn('Explore components '+ico('arrow',15),'primary','navigate','data-target="catalog"')} ${actionBtn('Browse tokens','secondary','navigate','data-target="variables"')}</div><div class="hero-art"><span class="float-dot one"></span><span class="float-dot two"></span><div class="float-window"><div style="display:flex;justify-content:space-between;align-items:center"><strong style="font-size:12px;color:#101828">Quick component preview</strong><span style="color:#12b76a;font-size:9px;font-weight:700">● Ready</span></div><div class="mini-swatches"><i style="background:#f4ebff"></i><i style="background:#e9d7fe"></i><i style="background:#d6bbfb"></i><i style="background:#9e77ed"></i><i style="background:#7f56d9"></i><i style="background:#6941c6"></i></div><div class="mini-field">Email address</div><div class="mini-input">you@example.com</div><span class="mini-brandbutton">Get started →</span></div><div class="float-tag">✦ 865 design variables</div></div></div>
 <div class="info-strip">${ico('info',17)} <span><strong>About fidelity:</strong> Token values and source page inventory were extracted from your .fig file. Interactive component examples here are an HTML reference implementation, not exact renderings of every Figma component or proprietary SVG.</span></div>
 <div class="four-col">${overviewCard('layers','Design nodes',source.nodeCount,'Parsed from .fig')}${overviewCard('components','Main components',source.totalComponents,'Figma SYMBOL nodes')}${overviewCard('palette','Design variables',source.tokensCount,'Light & dark values')}${overviewCard('grid2','Browsable sections',source.pageCount,'Navigable HTML catalog')}</div>
 ${section('Foundations',`<div class="two-col">${card('Brand color system',`<div class="card-pad"><div class="swatch-wrap" style="grid-template-columns:repeat(6,1fr)">${[100,200,300,400,500,600].map(s=>{const col=token('Colors/Brand/'+s)||'#7f56d9';return `<div class="swatch" data-copy="${col}" title="Copy ${col}"><div class="swatch-color" style="background:${col}"></div><div class="swatch-label">${s}</div><div class="swatch-code">${col}</div></div>`}).join('')}</div><p class="small muted" style="margin:17px 0 0">Brand / 600 · <strong>${token('Colors/Brand/600')}</strong> · Extracted from Figma</p></div>`)}${card('Type scale',`<div class="card-pad"><div style="font-size:29px;letter-spacing:-1px;font-weight:700;line-height:1.3">Aa  Typography</div><p style="font-size:12px;color:var(--muted);margin:6px 0 16px">Inter · Display and text scales</p>${[12,14,16,18,20].map(s=>`<span style="display:inline-flex;align-items:center;justify-content:center;height:35px;width:35px;border-radius:7px;border:1px solid var(--border);margin-right:7px;font-size:${s}px;font-weight:650">Aa</span>`).join('')}</div>`)}</div>`,'Source-backed tokens you can inspect, copy, and export.',`<button class="ui-button secondary sm" data-action="navigate" data-target="variables">View all tokens ${ico('arrow',14)}</button>`)}
 ${section('Browse the library',`<div class="four-col">${groupCounts.map(g=>`<button class="catalog-card" data-action="go-group" data-group="${g.name}"><span class="catalog-icon">${ico(g.icon,19)}</span><strong>${esc(g.name)}</strong><small>${g.count} Figma page sections</small><div class="catalog-bottom">Browse collection →</div></button>`).join('')}</div>`,'Explore major component groups from the uploaded design system.')}
 ${section('Popular components',`<div class="four-col">${fav.map(name=>{let p=byName[name.toLowerCase()];if(!p)return '';return `<button class="catalog-card" data-action="navigate" data-target="${p.id}"><span class="catalog-icon">${ico(dynamicPageIcon(name),18)}</span><strong>${name}</strong><small>${nfmt(p.components)} source component nodes</small><div class="catalog-bottom">Open preview ${ico('arrow',13)}</div></button>`}).join('')}</div>`,'Start with reusable building blocks from the system.')}

 const filtered=pages.filter(p=>!q||p.name.toLowerCase().includes(q)||p.group.toLowerCase().includes(q));

function renderVariables(){

 section('Token explorer',`<div class="card"><div class="card-head"><input id="variables-filter" class="catalog-search" placeholder="Search tokens, e.g. Brand/600..." aria-label="Filter variables" style="width:420px;max-width:100%;"/><button class="ui-button secondary sm" data-action="copy-all-tokens">${ico('copy',13)} Copy JSON</button></div><div class="table-overflow" style="max-height:650px;overflow:auto"><table class="token-table"><thead><tr><th>Variable / CSS custom property</th><th>Light value</th><th>Dark value</th><th>Type</th></tr></thead><tbody id="variables-body">${tokens.map(t=>`<tr data-token="${attr(t.name.toLowerCase())}"><td><strong>${esc(t.name)}</strong><div class="copy-code">${esc(t.cssName)}</div></td><td data-copy="${attr(t.light??'')}" style="cursor:pointer">${colorDot(t.light)}${esc(t.light??'Alias unresolved')}</td><td data-copy="${attr(t.dark??'')}" style="cursor:pointer">${colorDot(t.dark)}${esc(t.dark??'—')}</td><td><span class="pill">${esc(t.type)}</span></td></tr>`).join('')}</tbody></table></div><div class="showcase-toolbar"><span>Token values are exported as editable JSON and CSS variables.</span><button class="ui-button secondary sm" data-action="export-css">Download tokens.css</button></div></div>`,'Click a color or value to copy it.')+

function getCode(name){const snippets={
 Buttons:`<button class="ui-button">Primary action</button>\n<button class="ui-button secondary">Secondary action</button>\n<button class="ui-button destructive">Delete item</button>`,

 };
 return snippets[name]||`<!-- ${name} -->\n<!-- This is a hand-authored HTML reference, not an exact Figma export. -->\n<section class="card" aria-label="${name}">\n  <h2>${name}</h2>\n  <!-- Adapt the components shown in the Preview tab. -->\n</section>`;

function paletteFamily(name){

function previewColors(){

function previewEmpty(){return card('Empty state',stage(`<div style="text-align:center;max-width:350px"><div class="modal-icon" style="margin:0 auto 15px;height:56px;width:56px">${ico('folder',26)}</div><h3 style="margin:0 0 6px">No projects yet</h3><p class="small muted">Create your first project to start organizing your design work.</p><button class="ui-button" data-action="show-toast">+ Create project</button></div>`,'plain'))}
function previewNav(){return card('Application sidebar',stage(`<div class="prototype-shell"><div class="prototype-nav"><div class="fake-logo" style="margin-bottom:20px"><i></i>Untitled UI</div>${['Overview','Dashboard','Analytics','Projects','Settings'].map((v,i)=>`<div class="${i===1?'selected':''}">${ico(['grid','chart','trend','folder','settings'][i],13)} &nbsp;${v}</div>`).join('')}</div><div class="prototype-content"><div class="eyebrow" style="font-size:9px">Dashboard / Overview</div><h3 style="font-size:19px">Dashboard overview</h3><div class="small muted">Welcome back! Here's what's happening today.</div><div class="two-col" style="margin-top:25px">${[0,1].map(i=>`<div class="stat-card" style="min-height:110px"><div class="stat-name">${i?'New users':'Revenue'}</div><div class="stat-number" style="font-size:24px">${i?'1,409':'$24.5k'}</div></div>`).join('')}</div></div></div>`,'plain'))}
function previewPricing(){return `<div class="three-col">${[['Basic','$0','For individuals getting started'],['Pro','$29','For professionals and small teams'],['Business','$79','For teams working at scale']].map(([title,price,desc],i)=>`<div class="card card-pad" style="min-height:300px;border-color:${i===1?'#d6bbfb':''}"><div class="ui-badge ${i===1?'purple':'gray'}" style="margin-bottom:15px">${i===1?'Most popular':'Monthly plan'}</div><div class="overline">${title}</div><h2 style="font-size:35px;margin:9px 0 5px">${price}<span style="font-size:12px;color:var(--muted);font-weight:400"> / month</span></h2><p class="small muted">${desc}</p><hr style="border:0;border-top:1px solid var(--border);margin:20px 0"><ul class="list-items" style="margin-bottom:18px">${['Design resources','Reusable components','Documentation'].map(s=>`<li>${ico('check',14)}<strong>${s}</strong></li>`).join('')}</ul><button class="ui-button ${i===1?'':'secondary'}" style="width:100%" data-action="show-toast">Get started</button></div>`).join('')}</div>`}
function previewMarketing(){return card('Responsive marketing block',stage(`<div class="marketing-hero"><div class="marketing-header"><span class="fake-logo"><i></i>untitled ui.</span><div class="icon-grid-sm"><span></span><span></span><span></span></div><button class="ui-button sm" data-action="show-toast">Get started</button></div><div class="marketing-main"><span class="ui-badge purple">Introducing the new release →</span><h2>Beautiful, reusable components to build faster</h2><p>A consistent experience across every screen, built on a flexible foundation of design tokens.</p><button class="ui-button" data-action="show-toast">Start building ${ico('arrow',14)}</button> <button class="ui-button secondary" data-action="show-toast">Learn more</button></div></div>`,'plain'),'Representative HTML marketing composition, not source-perfect render')}
function previewIcons(){const samples=['grid','palette','type','box','layers','circle','corners','components','mouse','check','bell','folder','card','table','sliders','calendar','settings','search','arrow','arrowDown','external','copy','info','upload','trend','heart','mail','user','users','chart','filter','clock','help','code','mobile','image','file','chevron','lock','globe','alert'];return card('Icon references',`<div class="card-pad"><div class="icon-gallery">${samples.map(n=>`<div class="icon-tile" data-copy="${n}" role="button" tabindex="0">${ico(n,22)}<span>${n}</span></div>`).join('')}</div></div>`,'Generic editable SVG line icon set used in this HTML preview; not exported Figma vector paths')}
function previewGeneric(name){let title=esc(name);let style;/\b/.test(name);if(/header|section|blog|team|page|cta|navigation|testimonial|feature|footer|social proof|pricing|newsletter|content/i.test(name))return previewMarketing();if(/card|activity|messaging/i.test(name))return previewMetrics();if(/icon|logo|asset|annotation/i.test(name))return previewIcons();if(/button|tag|badge/i.test(name))return previewBadges();if(/progress|indicator/i.test(name))return previewProgress();if(/checkbox|toggle/i.test(name))return previewChecks();if(/date|calendar/i.test(name))return previewCalendar();if(/modal|slideout/i.test(name))return previewModals();if(/alert|notification/i.test(name))return previewAlerts();return `${card(`${title} examples`,stage(`<div class="feature-block" style="width:100%;max-width:460px"><div class="feature-demo">${ico(dynamicPageIcon(name),42)}</div><div class="feature-text"><h3>${title}</h3><p>Representative component structure, source component inventory available below.</p></div></div>`,'plain'))}<div class="info-strip">${ico('info')} The original Figma page contains additional layouts and variants. Their metadata is listed below; this HTML preview is an implementation example, not a full 1:1 conversion.</div>`}
function buildPreview(name){
 if(name==='Colors')return previewColors();if(name==='Typography')return previewTypography();if(name==='Spacing, radius & grids')return previewSpacing();if(name==='Effect styles')return previewEffects();
 if(name==='Buttons'||name==='Button groups')return previewButtons();if(name==='Badges'||name==='Tags')return previewBadges();if(name==='Inputs')return previewInputs();if(name==='Dropdowns'||name==='Command menus')return previewDropdowns();if(name==='Checkboxes'||name==='Checkbox groups')return previewChecks();if(name==='Toggles')return previewToggles();if(name==='Avatars')return previewAvatars();if(name==='Tabs'||name==='Breadcrumbs')return previewTabs();
 if(name==='Progress steps'||name==='Progress indicators')return previewProgress();if(name==='Pagination')return previewPagination();if(name==='Tooltips')return previewTooltip();if(name==='Sliders')return previewSlider();if(name==='Date pickers'||name==='Calendars')return previewCalendar();if(name==='File upload')return previewUpload();if(name==='Modals'||name==='Slideout menus')return previewModals();if(name==='Alerts & notifications')return previewAlerts();if(name==='Tables')return previewTable();if(name==='Charts'||name==='Metrics')return previewMetrics();if(name==='Empty states'||name==='404 pages')return previewEmpty();if(name==='Application navigation')return previewNav();if(name==='Pricing sections'||name==='Pricing pages')return previewPricing();if(name==='Icons'||name==='Misc icons'||name==='Logos')return previewIcons();return previewGeneric(name);
}
function openModal(danger=false){root.innerHTML=`<div class="modal-backdrop" data-action="close-overlay"><div class="modal-box" role="dialog" aria-modal="true" aria-label="${danger?'Delete confirmation':'Confirmation dialog'}"><div class="modal-icon" style="${danger?'background:#fef3f2;color:var(--danger);border-color:#fecdca':''}">${ico(danger?'alert':'check',21)}</div><h2>${danger?'Delete this item?':'Save your changes?'}</h2><p>${danger?'This action cannot be undone. This is only a demo, so no real data will be deleted.':'You can edit your account details anytime. Confirm to see the feedback state in this demo.'}</p><div class="modal-actions"><button class="ui-button secondary" data-action="close-overlay">Cancel</button><button class="ui-button ${danger?'destructive':''}" data-action="confirm-modal">${danger?'Delete item':'Save changes'}</button></div></div></div>`}
function renderSearchResults(q=''){
 const el=document.getElementById('search-results');if(!el)return;let query=q.toLowerCase().trim();let list=pages.filter(p=>!query||p.name.toLowerCase().includes(query)||p.group.toLowerCase().includes(query)).slice(0,14);
 el.innerHTML= `<button class="search-option" data-action="navigate" data-target="overview">${ico('grid',16)}<strong>Overview</strong><span>Workspace</span></button><button class="search-option" data-action="navigate" data-target="variables">${ico('palette',16)}<strong>Design variables</strong><span>${tokens.length} tokens</span></button>`+list.map(p=>`<button class="search-option" data-action="navigate" data-target="${p.id}">${ico(dynamicPageIcon(p.name),16)}<strong>${esc(p.name)}</strong><span>${esc(p.group)}</span></button>`).join('')+(!list.length?`<div class="empty-result">No matching components found</div>`:'');
}
function openSearch(){root.innerHTML=`<div class="search-backdrop" data-action="close-overlay"><div class="search-modal" role="dialog" aria-modal="true"><input id="command-input" type="search" placeholder="Search pages, components, foundations..." autocomplete="off" aria-label="Search components"/><div id="search-results" class="search-results"></div><div class="search-footer"><span>↑ ↓ Navigate results · Esc to close</span><span>Untitled UI / PRO</span></div></div></div>`;renderSearchResults();document.getElementById('command-input').focus()}
function updateCatalogFilter(q){document.querySelectorAll('.catalog-card[data-target]').forEach(el=>{el.style.display=!q||el.textContent.toLowerCase().includes(q.toLowerCase())?'':'none'})}
function updateTableFilter(q){let shown=0;document.querySelectorAll('#table-body tr').forEach(row=>{let ok=row.dataset.search.includes(q.toLowerCase());row.hidden=!ok;if(ok)shown++});let el=document.getElementById('table-count');if(el)el.textContent=`Showing ${shown} of ${tableRows.length} members`}
function handleAction(btn,ev){const act=btn.dataset.action;
 if(act==='navigate'){navigate(btn.dataset.target||'overview');return}
 if(act==='go-group'){let p=pages.find(x=>x.group===btn.dataset.group);if(p)navigate(p.id);return}
 if(act==='mobile-nav'){document.getElementById('sidebar').classList.toggle('open');return}
 if(act==='theme'){state.theme=state.theme==='light'?'dark':'light';try{localStorage.setItem('ds-theme',state.theme)}catch(e){}render();return}
 if(act==='open-search'){openSearch();return}
 if(act==='copy-page-code'){let pg=pages.find(x=>x.id===state.page);copyText(getCode(pg?.name||'Overview'));return}
 if(act==='copy-all-tokens'){copyText(JSON.stringify(tokens,null,2));return}
 if(act==='export-tokens'){downloadFile('untitled-ui-design-tokens.json',JSON.stringify({source:'Untitled UI PRO Variables v6.0',tokens},null,2),'application/json');return}
 if(act==='export-css'){exportCSS();return}
 if(act==='view-preview'){state.preview=btn.dataset.value;render();return}
 if(act==='set-size'){state.demoSize=btn.dataset.value;render();return}
 if(act==='demo-button'||act==='show-toast'||act==='row-action'){toast('Component interaction preview');return}
 if(act==='demo-loading'){btn.classList.add('loading');btn.disabled=true;setTimeout(()=>{btn.classList.remove('loading');btn.disabled=false;toast('Finished loading')},800);return}
 if(act==='open-modal'){openModal();return}
 if(act==='open-delete-modal'){openModal(true);return}
 if(act==='close-overlay'){if(ev.target===btn||btn.classList.contains('ui-button'))root.innerHTML='';return}
 if(act==='confirm-modal'){root.innerHTML='';toast('Action confirmed (demo)');return}
 if(act==='show-error-toast'){toast('Notification preview displayed');return}
 if(act==='dismiss-alert'){const el=btn.closest('.ui-alert');if(el){el.innerHTML='<div style="color:var(--muted);font-size:12px">Alert dismissed ✓</div>'}return}
 if(act==='dropdown-toggle'){let wrap=document.getElementById('demo-dropdown');wrap?.classList.toggle('open');btn.setAttribute('aria-expanded',String(wrap?.classList.contains('open')));return}
 if(act==='dropdown-option'){state.selectedOption=btn.dataset.value;render();return}
 if(act==='tab'){state.tab=Number(btn.dataset.value);render();return}
 if(act==='increase-progress'){state.progress=state.progress>=100?0:Math.min(100,state.progress+12);render();return}
 if(act==='change-page'){state.selectedPage=Number(btn.dataset.value);render();return}
 if(act==='calendar-move'){state.calendar=new Date(state.calendar.getFullYear(),state.calendar.getMonth()+Number(btn.dataset.value),1);state.selectedDate=1;render();return}
 if(act==='select-day'){state.selectedDate=Number(btn.dataset.value);render();toast('Date selected');return}
 if(act==='date-today'){let d=new Date();state.calendar=new Date(d.getFullYear(),d.getMonth(),1);state.selectedDate=d.getDate();render();return}
 if(act==='sort-table'){state.tableOrder=state.tableOrder==='asc'?'desc':'asc';render();return}
 if(act==='upload'){document.getElementById('file-input')?.click();return}
}
function initEvents(){
 document.addEventListener('click',ev=>{
  const navTarget=ev.target.closest('[data-route]');if(navTarget){ev.preventDefault();navigate(navTarget.dataset.route);return}
  const copy=ev.target.closest('[data-copy]');if(copy){let text=copy.dataset.copy;if(text)copyText(text);return}
  const act=ev.target.closest('[data-action]');if(act){if(act.classList.contains('search-backdrop')||act.classList.contains('modal-backdrop')){if(ev.target!==act)return}if(act.tagName==='A')ev.preventDefault();handleAction(act,ev);return}
  if(!ev.target.closest('.dropdown-demo'))document.getElementById('demo-dropdown')?.classList.remove('open');
 });
 document.addEventListener('keydown',ev=>{
  const editing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'||ev.key==='/'&&!editing){ev.preventDefault();openSearch();return}
  if(ev.key==='Escape'){root.innerHTML='';document.getElementById('demo-dropdown')?.classList.remove('open');return}
  if(ev.key==='Enter'&&ev.target?.hasAttribute('data-copy'))copyText(ev.target.dataset.copy);
 });
 document.addEventListener('input',ev=>{
  if(ev.target.id==='command-input')renderSearchResults(ev.target.value);
  if(ev.target.id==='variables-filter'){let q=ev.target.value.toLowerCase().trim();document.querySelectorAll('#variables-body tr').forEach(el=>el.hidden=!el.dataset.token.includes(q));}
  if(ev.target.id==='catalog-search'){let q=ev.target.value.toLowerCase().trim();state.tableSearch=q;updateCatalogFilter(q)}
  if(ev.target.id==='table-filter'){state.tableSearch=ev.target.value;updateTableFilter(ev.target.value)}
  if(ev.target.id==='demo-range'){let l=document.getElementById('slider-value');if(l)l.textContent=ev.target.value+'%'}
 });
 document.addEventListener('change',ev=>{
  if(ev.target.id==='file-input'){let f=ev.target.files?.[0];if(f){state.upload=f.name;render();toast('File selected (not uploaded)')}}
  if(ev.target.id==='check-all-rows')document.querySelectorAll('.row-check').forEach(c=>c.checked=ev.target.checked);
 });
 document.addEventListener('dragover',ev=>{if(ev.target.closest('#dragzone')){ev.preventDefault();document.getElementById('dragzone')?.classList.add('dragging')}});
 document.addEventListener('dragleave',ev=>{if(ev.target.closest('#dragzone'))document.getElementById('dragzone')?.classList.remove('dragging')});
 document.addEventListener('drop',ev=>{if(ev.target.closest('#dragzone')){ev.preventDefault();let f=ev.dataTransfer?.files?.[0];if(f){state.upload=f.name;render();toast('File selected (not uploaded)')}}});
 window.addEventListener('hashchange',()=>{const id=decodeURIComponent(window.location.hash.replace('#',''));if(id&&id!==state.page){state.page=id;render();window.scrollTo(0,0)}});
}
state.page=decodeURIComponent(window.location.hash.slice(1))||'overview';
if(!(['overview','catalog','variables'].includes(state.page)||pages.some(p=>p.id===state.page)))state.page='overview';
initEvents();render();
})();

</script>
</body>
</html>
