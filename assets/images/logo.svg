<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38" fill="none">
  <defs>
    <!-- Brand Gradient: Untitled UI Violet/Purple -->
    <linearGradient id="pdBrandGrad" x1="0" y1="0" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B7BE8" />
      <stop offset="45%" stop-color="#7F56D9" />
      <stop offset="100%" stop-color="#53389E" />
    </linearGradient>

    <!-- Glass Artboard Layer Gradient -->
    <linearGradient id="pdGlassGrad" x1="6" y1="7" x2="22" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>

    <!-- Pen Nib Gradient -->
    <linearGradient id="pdNibGrad" x1="14" y1="26" x2="26" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E9D7FE" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="pdShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#2D1577" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="38" height="38" rx="11" fill="url(#pdBrandGrad)" />
  <rect x="0.5" y="0.5" width="37" height="37" rx="10.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />

  <!-- Background Artboard / Wireframe Screen (UX Architecture) -->
  <rect x="6.5" y="6.5" width="16" height="19" rx="3.5" fill="url(#pdGlassGrad)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" />
  <line x1="9.5" y1="11" x2="18.5" y2="11" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.2" stroke-linecap="round" />
  <line x1="9.5" y1="14.5" x2="15.5" y2="14.5" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="10.5" cy="19" r="1.1" fill="#FFFFFF" fill-opacity="0.5" />
  <circle cx="14" cy="19" r="1.1" fill="#FFFFFF" fill-opacity="0.35" />

  <!-- Foreground Vector Pen Nib & Anchor (UI Craftsmanship) -->
  <g filter="url(#pdShadow)">
    <!-- Pen Nib Body angled at 45 degrees -->
    <path d="M15 27 L19 28.5 L28 19.5 L25 14 L19.5 17 L15 27 Z" fill="url(#pdNibGrad)" />
    <!-- Nib Highlight Facet -->
    <path d="M19.5 17 L25 14 L28 19.5 L23 22.5 Z" fill="#FFFFFF" fill-opacity="0.35" />
    <!-- Breather Hole & Slit -->
    <circle cx="21.5" cy="21.5" r="1.2" fill="#53389E" />
    <line x1="21.5" y1="21.5" x2="16" y2="27" stroke="#53389E" stroke-width="0.8" stroke-linecap="round" />
  </g>

  <!-- Design System Component Diamond Sparkle ❖ (System Thinking) -->
  <path d="M29 7 L30.3 10.7 L34 12 L30.3 13.3 L29 17 L27.7 13.3 L24 12 L27.7 10.7 Z" fill="#FFFFFF" />
  <circle cx="29" cy="12" r="0.9" fill="#7F56D9" />
</svg>
