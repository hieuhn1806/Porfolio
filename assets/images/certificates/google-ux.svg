<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" fill="none">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="840" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="gBorder" x1="0" y1="0" x2="840" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="35%" stop-color="#34A853"/>
      <stop offset="70%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#EA4335"/>
    </linearGradient>
    <filter id="cShadow" x="-10" y="-10" width="860" height="580" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Certificate Canvas -->
  <rect x="12" y="12" width="816" height="536" rx="16" fill="url(#gBg)" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="24" y="24" width="792" height="512" rx="10" stroke="url(#gBorder)" stroke-width="3" stroke-opacity="0.85"/>
  <rect x="32" y="32" width="776" height="496" rx="6" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Google Logo / Brand -->
  <g transform="translate(68, 64)">
    <path fill="#4285F4" d="M22.5 10.2c0-.7-.1-1.4-.2-2.1H11.5v4.2h6.2c-.3 1.4-1.1 2.6-2.3 3.4v2.8h3.7c2.2-2 3.4-5 3.4-8.3z"/>
    <path fill="#34A853" d="M11.5 21.4c3.1 0 5.7-1 7.6-2.8l-3.7-2.8c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.8H1.2v2.9c1.9 3.8 5.8 6.4 10.3 6.4z"/>
    <path fill="#FBBC05" d="M5.1 12.1c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V4.6H1.2C.4 6.2 0 8 0 9.8s.4 3.6 1.2 5.2l3.9-2.9z"/>
    <path fill="#EA4335" d="M11.5 4.1c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.2.9 14.6 0 11.5 0 7 0 3.1 2.6 1.2 6.4l3.9 2.9c.9-2.7 3.4-4.7 6.4-4.7z"/>
    <text x="32" y="16" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1E293B">Google Career Certificates</text>
  </g>

  <!-- Coursera Badge -->
  <g transform="translate(640, 64)">
    <rect width="130" height="32" rx="6" fill="#0056D2" fill-opacity="0.08"/>
    <text x="65" y="21" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0056D2" text-anchor="middle">COURSERA VERIFIED</text>
  </g>

  <!-- Certificate Heading -->
  <text x="420" y="160" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#64748B" text-anchor="middle">CERTIFICATE OF COMPLETION</text>
  <text x="420" y="196" font-family="Inter, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="middle">This is to certify that</text>

  <!-- Recipient Name -->
  <text x="420" y="250" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0F172A" text-anchor="middle">Hoàng Ngọc Hiếu</text>
  <line x1="220" y1="268" x2="620" y2="268" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Description -->
  <text x="420" y="302" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#475569" text-anchor="middle">has successfully completed all 7 courses of the professional program</text>
  <text x="420" y="338" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="750" fill="#1E3A8A" text-anchor="middle">Google UX Design Professional Certificate</text>
  
  <text x="420" y="375" font-family="Inter, -apple-system, sans-serif" font-size="12.5" fill="#64748B" text-anchor="middle">
    Foundations of UX · Empathize &amp; Define · Wireframing · Low &amp; High-Fidelity Prototyping in Figma · Usability Testing
  </text>

  <!-- Footer / Signatures / Metadata -->
  <g transform="translate(68, 440)">
    <!-- Signature Left -->
    <line x1="0" y1="36" x2="180" y2="36" stroke="#94A3B8" stroke-width="1"/>
    <text x="0" y="28" font-family="'Brush Script MT', cursive, sans-serif" font-size="22" fill="#334155">Amanda Brophy</text>
    <text x="0" y="52" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">Amanda Brophy</text>
    <text x="0" y="66" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#94A3B8">Global Director, Google Career Certificates</text>

    <!-- Center Seal -->
    <g transform="translate(310, -20)">
      <circle cx="42" cy="42" r="38" fill="#F8FAFC" stroke="#4285F4" stroke-width="2"/>
      <circle cx="42" cy="42" r="32" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
      <path d="M42 22 L46 34 L58 35 L49 43 L52 55 L42 48 L32 55 L35 43 L26 35 L38 34 Z" fill="#F59E0B"/>
      <text x="42" y="70" font-family="Inter, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#1E293B" text-anchor="middle">OFFICIAL CREDENTIAL</text>
    </g>

    <!-- Right Credential ID -->
    <g transform="translate(520, 20)">
      <text x="180" y="16" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="end">Credential ID: GUX-8942-7104</text>
      <text x="180" y="32" font-family="Inter, -apple-system, sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="end">Verify at: coursera.org/verify/professional-cert</text>
      <text x="180" y="48" font-family="Inter, -apple-system, sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="end">Issued: May 2024 · Grade: Achieved with Distinction</text>
    </g>
  </g>
</svg>
