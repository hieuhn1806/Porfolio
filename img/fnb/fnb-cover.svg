          <text x="14" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700">Bánh Mì Chảo Bò</text>
          <text x="14" y="46" fill="#16C9F6" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">65.000 đ</text>
          <text x="14" y="64" fill="rgba(255,255,255,0.45)" font-family="-apple-system, sans-serif" font-size="10">Bếp sẵn sàng</text>
