      <text x="214" y="80" fill="#10B981" font-family="-apple-system, sans-serif" font-size="10.5">VAT 8% · BOM</text>

      <!-- Item 2: Modifier Groups -->
      <g transform="translate(0, 120)">
        <rect width="402" height="105" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="16" y="28" fill="#16C9F6" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">MODIFIER GROUPS</text>
        <text x="16" y="50" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="600">Mức Đường &amp; Lượng Đá · Topping</text>
