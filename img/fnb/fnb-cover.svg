    <rect x="0" y="0" width="168" height="28" rx="14" fill="rgba(124,106,238,0.18)" stroke="rgba(124,106,238,0.4)"/>
    <circle cx="14" cy="14" r="4" fill="#16C9F6"/>
    <text x="26" y="18" fill="#16C9F6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">SOLPOS F&amp;B SUITE</text>
    
    <text x="0" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">F&amp;B Management &amp; Operations Architecture</text>
    <text x="0" y="102" fill="rgba(255,255,255,0.65)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="400">Kết nối nền tảng quản trị tập trung, ứng dụng bán hàng POS và gọi món qua QR tại bàn.</text>
  </g>

