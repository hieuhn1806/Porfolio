    <text x="342" y="30" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Master Data</text>

    <!-- Sub-elements inside Admin -->
    <g transform="translate(24, 75)">
      <!-- Item 1: Product & Variant -->
      <rect width="402" height="105" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <rect x="14" y="14" width="40" height="40" rx="8" fill="rgba(124,106,238,0.2)"/>
      <text x="26" y="38" fill="#7C6AEE" font-size="18">🍵</text>
      <text x="66" y="32" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Trà Sữa Ô Long Nướng</text>
      <text x="66" y="50" fill="rgba(255,255,255,0.5)" font-family="-apple-system, sans-serif" font-size="12">Món có biến thể · 45.000 đ – 55.000 đ</text>
      <rect x="66" y="65" width="62" height="22" rx="4" fill="rgba(255,255,255,0.08)"/>
      <text x="74" y="80" fill="rgba(255,255,255,0.8)" font-family="-apple-system, sans-serif" font-size="10.5">Size M (500ml)</text>
      <rect x="136" y="65" width="62" height="22" rx="4" fill="rgba(255,255,255,0.08)"/>
      <text x="144" y="80" fill="rgba(255,255,255,0.8)" font-family="-apple-system, sans-serif" font-size="10.5">Size L (700ml)</text>
