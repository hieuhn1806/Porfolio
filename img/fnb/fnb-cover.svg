        <text x="0" y="18" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Lợi ích vận hành</text>
        <text x="0" y="42" fill="rgba(255,255,255,0.7)" font-size="11.5">● Giảm 70% thời gian chờ gọi món</text>
        <text x="0" y="66" fill="rgba(255,255,255,0.7)" font-size="11.5">● Không nhầm lẫn mức đường / topping</text>
        <text x="0" y="90" fill="rgba(255,255,255,0.7)" font-size="11.5">● Tải mã in ấn chuẩn vector 300 DPI</text>
