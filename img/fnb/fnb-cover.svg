          <text x="14" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700">Combo Cơm Trưa</text>
          <text x="14" y="46" fill="#16C9F6" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">79.000 đ</text>
          <text x="14" y="64" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="10">Lunch Special (Active)</text>
        </g>
        <g transform="translate(204, 100)">
