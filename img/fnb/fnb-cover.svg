        <rect width="240" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>
        <text x="14" y="16" fill="rgba(255,255,255,0.7)" font-size="9.5">menu.solpos.vn/q1-t104</text>
        
        <text x="14" y="44" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Thực Đơn Tại Bàn</text>
        <text x="14" y="60" fill="rgba(255,255,255,0.45)" font-size="9.5">Tự động áp dụng Menu Trưa (11-14h)</text>
        
        <rect x="14" y="72" width="212" height="48" rx="6" fill="rgba(255,255,255,0.05)"/>
        <text x="24" y="92" fill="#FFFFFF" font-size="11" font-weight="600">Trà Sữa Ô Long Nướng</text>
        <text x="24" y="108" fill="#16C9F6" font-size="11" font-weight="700">45.000 đ</text>
        <rect x="175" y="84" width="42" height="24" rx="4" fill="url(#primary-fnb)"/>
        <text x="187" y="100" fill="#FFFFFF" font-size="10" font-weight="bold">Chọn</text>

        <rect x="14" y="130" width="212" height="52" rx="6" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)"/>
        <text x="24" y="150" fill="#10B981" font-size="10.5" font-weight="700">✓ Đơn hàng đã gửi xuống bếp</text>
        <text x="24" y="168" fill="rgba(255,255,255,0.6)" font-size="9.5">Nhân viên đang chuẩn bị món...</text>
      </g>

      <!-- Right: Operational Benefits -->
