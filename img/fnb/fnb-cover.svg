  <circle cx="1320" cy="300" r="140" fill="#16C9F6" opacity="0.15" filter="url(#glow-c)"/>
  <circle cx="800" cy="780" r="180" fill="#10B981" opacity="0.12" filter="url(#glow-p)"/>

  <!-- Top Hero Header / Eyebrow -->
