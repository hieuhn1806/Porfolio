        <text x="14" y="44" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12">1x Trà Sữa Nướng (M)</text>
        <text x="195" y="44" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">45.000</text>
        <text x="24" y="60" fill="rgba(255,255,255,0.45)" font-size="10">+ Trân châu hoàng kim (+10k)</text>
        
        <text x="14" y="82" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12">1x Cà Phê Muối Đá</text>
