          <!-- Inner white grid pattern simulating real QR -->
          <rect x="8" y="8" width="34" height="34" fill="#FFFFFF"/>
          <rect x="14" y="14" width="22" height="22" fill="#0F172A"/>
          <rect x="78" y="8" width="34" height="34" fill="#FFFFFF"/>
          <rect x="84" y="14" width="22" height="22" fill="#0F172A"/>
          <rect x="8" y="78" width="34" height="34" fill="#FFFFFF"/>
          <rect x="14" y="84" width="22" height="22" fill="#0F172A"/>
          <circle cx="60" cy="60" r="10" fill="#7C6AEE"/>
          <text x="60" y="64" fill="#FFFFFF" font-size="8" font-weight="bold" text-anchor="middle">SOL</text>
        </g>
        <text x="105" y="190" fill="#0F172A" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">BÀN T1-04 · Q1</text>
