<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ui3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="100%" stop-color="#080A10"/>
    </linearGradient>
    <linearGradient id="card-grad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B26"/>
      <stop offset="100%" stop-color="#111520"/>
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6AEE"/>
      <stop offset="100%" stop-color="#5B45E0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg-ui3)"/>

  <!-- Left Sidebar (Admin Navigation) -->
  <g transform="translate(0, 0)">
    <rect width="260" height="1000" fill="#0B0E17" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Logo -->
    <g transform="translate(24, 28)">
      <circle cx="16" cy="16" r="14" fill="url(#accent-purple)"/>
      <text x="16" y="21" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" text-anchor="middle">S</text>
      <text x="40" y="22" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">SOLPOS</text>
      <text x="110" y="22" fill="#16C9F6" font-family="monospace" font-size="11" font-weight="700">F&amp;B</text>
    </g>

    <!-- Nav Items -->
    <g transform="translate(16, 90)">
      <text x="12" y="0" fill="rgba(255,255,255,0.35)" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">QUẢN TRỊ F&amp;B</text>
      
      <!-- Product -->
      <g transform="translate(0, 16)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">🍔</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Sản phẩm &amp; Món</text>
      </g>

      <!-- Modifier Groups -->
      <g transform="translate(0, 64)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">⚡</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Nhóm tùy chọn (Mod)</text>
      </g>

      <!-- Active: Menu Management -->
      <g transform="translate(0, 112)">
        <rect width="228" height="40" rx="8" fill="rgba(245,158,11,0.18)" stroke="rgba(245,158,11,0.4)"/>
        <text x="16" y="25" fill="#F59E0B" font-size="16">📋</text>
        <text x="44" y="25" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Thực đơn theo giờ</text>
        <circle cx="210" cy="20" r="3" fill="#F59E0B"/>
      </g>

      <!-- Room & Table -->
      <g transform="translate(0, 160)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">🪑</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Khu vực &amp; Bàn</text>
      </g>

      <!-- QR Order -->
      <g transform="translate(0, 208)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">📱</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Quản lý QR Order</text>
      </g>
    </g>
  </g>

  <!-- Top Bar -->
  <g transform="translate(260, 0)">
    <rect width="1340" height="70" fill="#0E121B" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="32" y="40" fill="rgba(255,255,255,0.5)" font-family="-apple-system, sans-serif" font-size="13">Thực đơn / </text>
    <text x="115" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Thực đơn Bữa Trưa (Lunch Special · 11:00 - 14:00)</text>

    <!-- Status pill -->
    <rect x="1030" y="22" width="120" height="26" rx="13" fill="rgba(16,185,129,0.15)" stroke="#10B981"/>
    <circle cx="1046" cy="35" r="4" fill="#10B981"/>
    <text x="1058" y="39" fill="#10B981" font-size="11" font-weight="700">Đang hoạt động</text>

    <rect x="1175" y="18" width="135" height="34" rx="6" fill="url(#accent-orange)"/>
    <text x="1200" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700">Lưu thực đơn</text>
  </g>

  <!-- Main Body: 3 Questions Unified Verification Loop -->
  <g transform="translate(292, 94)">
    <text x="0" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">Tổ chức Thực Đơn (Menu Scheduling &amp; Routing)</text>
    <text x="0" y="52" fill="rgba(255,255,255,0.55)" font-family="-apple-system, sans-serif" font-size="13.5">Đưa ba câu hỏi vận hành vào cùng một luồng kiểm tra trực quan: Bán món gì? Bán khi nào? Bán ở cửa hàng nào?</text>

    <!-- 3 Question Cards Grid -->
    <g transform="translate(0, 80)">
      
      <!-- QUESTION 1: BÁN MÓN GÌ? (410px) -->
      <g>
        <rect width="410" height="710" rx="12" fill="url(#card-grad3)" stroke="rgba(255,255,255,0.1)"/>
        <rect width="410" height="50" rx="12" fill="rgba(255,255,255,0.03)"/>
        
        <circle cx="30" cy="25" r="12" fill="rgba(124,106,238,0.2)"/>
        <text x="30" y="30" fill="#7C6AEE" font-size="12" font-weight="bold" text-anchor="middle">1</text>
        <text x="52" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">BÁN MÓN GÌ?</text>
        <text x="52" y="40" fill="rgba(255,255,255,0.45)" font-size="10.5">Danh mục &amp; 21 món đã gán</text>

        <g transform="translate(20, 68)">
          <!-- Search in menu -->
          <rect width="370" height="34" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.12)"/>
          <text x="14" y="22" fill="rgba(255,255,255,0.4)" font-size="12">🔍 Tìm món trong thực đơn...</text>

          <!-- Category 1: Cơm trưa văn phòng -->
          <g transform="translate(0, 50)">
            <rect width="370" height="32" rx="4" fill="rgba(255,255,255,0.04)"/>
            <text x="12" y="21" fill="#16C9F6" font-size="11.5" font-weight="700">CƠM TRƯA VĂN PHÒNG (6 MÓN)</text>
            <text x="330" y="21" fill="rgba(255,255,255,0.4)" font-size="11">Sửa</text>

            <g transform="translate(10, 42)">
              <text x="0" y="16" fill="#FFFFFF" font-size="12">1. Cơm bò sốt tiêu đen</text>
              <text x="280" y="16" fill="#10B981" font-size="12" font-weight="700">75.000 đ</text>
              
              <text x="0" y="44" fill="#FFFFFF" font-size="12">2. Cơm gà sốt nấm teriyaki</text>
              <text x="280" y="44" fill="#10B981" font-size="12" font-weight="700">69.000 đ</text>

              <text x="0" y="72" fill="#FFFFFF" font-size="12">3. Cơm sườn nướng mật ong</text>
              <text x="280" y="72" fill="#10B981" font-size="12" font-weight="700">79.000 đ</text>
            </g>
          </g>

          <!-- Category 2: Đồ uống ăn kèm -->
          <g transform="translate(0, 185)">
            <rect width="370" height="32" rx="4" fill="rgba(255,255,255,0.04)"/>
            <text x="12" y="21" fill="#7C6AEE" font-size="11.5" font-weight="700">ĐỒ UỐNG KÈM COMBO (8 MÓN)</text>
            <text x="330" y="21" fill="rgba(255,255,255,0.4)" font-size="11">Sửa</text>

            <g transform="translate(10, 42)">
              <text x="0" y="16" fill="#FFFFFF" font-size="12">1. Trà Sữa Ô Long Nướng (M)</text>
              <text x="280" y="16" fill="#10B981" font-size="12" font-weight="700">35.000 đ</text>

              <text x="0" y="44" fill="#FFFFFF" font-size="12">2. Cà Phê Muối Kem Béo</text>
              <text x="280" y="44" fill="#10B981" font-size="12" font-weight="700">29.000 đ</text>

              <text x="0" y="72" fill="#FFFFFF" font-size="12">3. Trà Chanh Leo Hạt Chia</text>
              <text x="280" y="72" fill="#10B981" font-size="12" font-weight="700">25.000 đ</text>
            </g>
          </g>

          <!-- Category 3: Tráng miệng -->
          <g transform="translate(0, 320)">
            <rect width="370" height="32" rx="4" fill="rgba(255,255,255,0.04)"/>
            <text x="12" y="21" fill="#F59E0B" font-size="11.5" font-weight="700">MÓN TRÁNG MIỆNG (3 MÓN)</text>
            <text x="330" y="21" fill="rgba(255,255,255,0.4)" font-size="11">Sửa</text>

            <g transform="translate(10, 42)">
              <text x="0" y="16" fill="#FFFFFF" font-size="12">1. Panna Cotta Dâu Tây</text>
              <text x="280" y="16" fill="#10B981" font-size="12" font-weight="700">25.000 đ</text>
            </g>
          </g>

          <rect x="0" y="430" width="370" height="34" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)"/>
          <text x="120" y="452" fill="#16C9F6" font-size="12" font-weight="700">+ Thêm món vào thực đơn</text>
        </g>
      </g>

      <!-- QUESTION 2: BÁN KHI NÀO? (430px) -->
      <g transform="translate(430, 0)">
        <rect width="430" height="710" rx="12" fill="url(#card-grad3)" stroke="rgba(245,158,11,0.3)"/>
        <rect width="430" height="50" rx="12" fill="rgba(245,158,11,0.1)"/>
        
        <circle cx="30" cy="25" r="12" fill="rgba(245,158,11,0.25)"/>
        <text x="30" y="30" fill="#F59E0B" font-size="12" font-weight="bold" text-anchor="middle">2</text>
        <text x="52" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">BÁN KHI NÀO? (TIME SLOTS)</text>
        <text x="52" y="40" fill="#F59E0B" font-size="10.5">Khung giờ vàng &amp; Ngày phục vụ</text>

        <g transform="translate(20, 68)">
          <!-- Day-of-week Selector -->
          <text x="0" y="14" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Ngày áp dụng trong tuần</text>
          
          <g transform="translate(0, 26)">
            <!-- Mon - Fri Active -->
            <rect x="0" y="0" width="48" height="38" rx="6" fill="url(#accent-orange)"/>
            <text x="14" y="24" fill="#FFFFFF" font-size="12" font-weight="800">T2</text>

            <rect x="54" y="0" width="48" height="38" rx="6" fill="url(#accent-orange)"/>
            <text x="68" y="24" fill="#FFFFFF" font-size="12" font-weight="800">T3</text>

            <rect x="108" y="0" width="48" height="38" rx="6" fill="url(#accent-orange)"/>
            <text x="122" y="24" fill="#FFFFFF" font-size="12" font-weight="800">T4</text>

            <rect x="162" y="0" width="48" height="38" rx="6" fill="url(#accent-orange)"/>
            <text x="176" y="24" fill="#FFFFFF" font-size="12" font-weight="800">T5</text>

            <rect x="216" y="0" width="48" height="38" rx="6" fill="url(#accent-orange)"/>
            <text x="230" y="24" fill="#FFFFFF" font-size="12" font-weight="800">T6</text>

            <!-- Sat - Sun Inactive -->
            <rect x="270" y="0" width="48" height="38" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
            <text x="284" y="24" fill="rgba(255,255,255,0.3)" font-size="12">T7</text>

            <rect x="324" y="0" width="48" height="38" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
            <text x="338" y="24" fill="rgba(255,255,255,0.3)" font-size="12">CN</text>
          </g>

          <!-- Operating Hours Slot -->
          <g transform="translate(0, 90)">
            <text x="0" y="14" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Khung giờ phục vụ (Time Slots)</text>
            
            <!-- Slot 1: Lunch 11-14h -->
            <g transform="translate(0, 26)">
              <rect width="390" height="74" rx="8" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.3)"/>
              <text x="16" y="26" fill="#F59E0B" font-size="12" font-weight="700">KHUNG 01: CA TRƯA CAO ĐIỂM</text>
              <text x="16" y="52" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="800">11:00  →  14:00</text>
              <rect x="270" y="16" width="105" height="24" rx="4" fill="rgba(16,185,129,0.2)"/>
              <text x="282" y="32" fill="#10B981" font-size="10.5" font-weight="700">Active Live</text>
            </g>

            <!-- Slot 2: Optional Extra Slot -->
            <g transform="translate(0, 110)">
              <rect width="390" height="50" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
              <text x="16" y="30" fill="rgba(255,255,255,0.5)" font-size="12">+ Thêm khung giờ phục vụ thứ 2 trong ngày</text>
            </g>
          </g>

          <!-- Auto Dispatch Engine status -->
          <g transform="translate(0, 290)">
            <rect width="390" height="150" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)"/>
            <text x="16" y="24" fill="#FFFFFF" font-size="12" font-weight="700">CƠ CHẾ KÍCH HOẠT TỰ ĐỘNG</text>
            <text x="16" y="50" fill="rgba(255,255,255,0.7)" font-size="11.5">● Đúng 11:00: Hệ thống tự động đẩy các món lunch lên màn hình quầy POS và thực đơn QR.</text>
            <text x="16" y="80" fill="rgba(255,255,255,0.7)" font-size="11.5">● Đúng 14:00: Tự động ẩn các món lunch để chuyển sang ca chiều, tránh khách đặt ngoài giờ.</text>
            <text x="16" y="110" fill="#10B981" font-size="11.5" font-weight="600">✓ Không cần quản lý cửa hàng thao tác thủ công</text>
          </g>
        </g>
      </g>

      <!-- QUESTION 3: BÁN Ở CỬA HÀNG NÀO? (410px) -->
      <g transform="translate(880, 0)">
        <rect width="410" height="710" rx="12" fill="url(#card-grad3)" stroke="rgba(255,255,255,0.1)"/>
        <rect width="410" height="50" rx="12" fill="rgba(255,255,255,0.03)"/>
        
        <circle cx="30" cy="25" r="12" fill="rgba(16,185,129,0.2)"/>
        <text x="30" y="30" fill="#10B981" font-size="12" font-weight="bold" text-anchor="middle">3</text>
        <text x="52" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">BÁN Ở CỬA HÀNG NÀO?</text>
        <text x="52" y="40" fill="rgba(255,255,255,0.45)" font-size="10.5">Phân phối chi nhánh (3/4 Active)</text>

        <g transform="translate(20, 68)">
          <!-- Branch 1: Q1 -->
          <g>
            <rect width="370" height="86" rx="8" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)"/>
            <text x="16" y="26" fill="#FFFFFF" font-size="13" font-weight="700">Chi nhánh Quận 1 (Trụ sở chính)</text>
            <text x="16" y="46" fill="rgba(255,255,255,0.55)" font-size="11">42 Lê Duẩn, P. Bến Nghé · 16 bàn</text>
            <rect x="16" y="56" width="90" height="20" rx="4" fill="rgba(16,185,129,0.2)"/>
            <text x="24" y="70" fill="#10B981" font-size="10" font-weight="700">● 2 Quầy POS Live</text>
            <rect x="310" y="16" width="46" height="24" rx="12" fill="#10B981"/>
            <circle cx="344" cy="28" r="8" fill="#FFFFFF"/>
          </g>

          <!-- Branch 2: Thảo Điền -->
          <g transform="translate(0, 98)">
            <rect width="370" height="86" rx="8" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)"/>
            <text x="16" y="26" fill="#FFFFFF" font-size="13" font-weight="700">Chi nhánh Thảo Điền (TP. Thủ Đức)</text>
            <text x="16" y="46" fill="rgba(255,255,255,0.55)" font-size="11">12 Quốc Hương, P. Thảo Điền · 24 bàn</text>
            <rect x="16" y="56" width="90" height="20" rx="4" fill="rgba(16,185,129,0.2)"/>
            <text x="24" y="70" fill="#10B981" font-size="10" font-weight="700">● 3 Quầy POS Live</text>
            <rect x="310" y="16" width="46" height="24" rx="12" fill="#10B981"/>
            <circle cx="344" cy="28" r="8" fill="#FFFFFF"/>
          </g>

          <!-- Branch 3: Cầu Giấy HN -->
          <g transform="translate(0, 196)">
            <rect width="370" height="86" rx="8" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)"/>
            <text x="16" y="26" fill="#FFFFFF" font-size="13" font-weight="700">Chi nhánh Cầu Giấy (Hà Nội)</text>
            <text x="16" y="46" fill="rgba(255,255,255,0.55)" font-size="11">88 Duy Tân, Cầu Giấy · 14 bàn</text>
            <rect x="16" y="56" width="90" height="20" rx="4" fill="rgba(16,185,129,0.2)"/>
            <text x="24" y="70" fill="#10B981" font-size="10" font-weight="700">● 1 Quầy POS Live</text>
            <rect x="310" y="16" width="46" height="24" rx="12" fill="#10B981"/>
            <circle cx="344" cy="28" r="8" fill="#FFFFFF"/>
          </g>

          <!-- Branch 4: Đà Nẵng (Inactive) -->
          <g transform="translate(0, 294)">
            <rect width="370" height="86" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
            <text x="16" y="26" fill="rgba(255,255,255,0.6)" font-size="13">Chi nhánh Bạch Đằng (Đà Nẵng)</text>
            <text x="16" y="46" fill="rgba(255,255,255,0.35)" font-size="11">Chưa áp dụng menu này</text>
            <rect x="310" y="16" width="46" height="24" rx="12" fill="rgba(255,255,255,0.1)"/>
            <circle cx="322" cy="28" r="8" fill="rgba(255,255,255,0.4)"/>
          </g>

          <!-- Add branch -->
          <rect x="0" y="410" width="370" height="34" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)"/>
          <text x="130" y="432" fill="#10B981" font-size="12" font-weight="700">+ Gán thêm chi nhánh</text>
        </g>
      </g>
    </g>
  </g>
</svg>
