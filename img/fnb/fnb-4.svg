          <text x="130" y="476" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Lưu và tạo 16 bàn</text>
        </g>
      </g>

      <!-- RIGHT: Interactive Floor Plan / Preview Grid (16 Tables) -->
