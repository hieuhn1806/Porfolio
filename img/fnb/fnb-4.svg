          <g transform="translate(0, 0)">
            <rect width="180" height="130" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.35)" stroke-width="1.5"/>
            <text x="14" y="26" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="900">T1-01</text>
            <rect x="110" y="12" width="56" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
            <text x="118" y="25" fill="#10B981" font-size="9.5" font-weight="700">Trống</text>
            <text x="14" y="52" fill="rgba(255,255,255,0.6)" font-size="11">4 Chỗ · Bàn vuông</text>
            <text x="14" y="74" fill="#16C9F6" font-size="11">Mã QR: Sẵn sàng</text>
            <rect x="14" y="90" width="152" height="26" rx="4" fill="rgba(255,255,255,0.04)"/>
            <text x="44" y="107" fill="rgba(255,255,255,0.7)" font-size="10.5">In mã QR ↗</text>
          </g>

          <!-- Table 02: Occupied -->
          <g transform="translate(195, 0)">
            <rect width="180" height="130" rx="10" fill="rgba(124,106,238,0.12)" stroke="rgba(124,106,238,0.5)" stroke-width="1.5"/>
            <text x="14" y="26" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="900">T1-02</text>
            <rect x="100" y="12" width="66" height="18" rx="4" fill="url(#accent-purple)"/>
            <text x="108" y="25" fill="#FFFFFF" font-size="9.5" font-weight="700">Có khách</text>
            <text x="14" y="52" fill="rgba(255,255,255,0.8)" font-size="11">3 Khách · 11:20</text>
            <text x="14" y="74" fill="#10B981" font-size="11.5" font-weight="700">Đơn: 185.000 đ</text>
            <rect x="14" y="90" width="152" height="26" rx="4" fill="rgba(124,106,238,0.2)"/>
            <text x="40" y="107" fill="#7C6AEE" font-size="10.5" font-weight="700">Xem đơn bàn</text>
          </g>

          <!-- Table 03: QR Ordering -->
          <g transform="translate(390, 0)">
            <rect width="180" height="130" rx="10" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
            <text x="14" y="26" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="900">T1-03</text>
            <rect x="95" y="12" width="72" height="18" rx="4" fill="rgba(245,158,11,0.25)"/>
            <text x="102" y="25" fill="#F59E0B" font-size="9.5" font-weight="700">QR Order</text>
            <text x="14" y="52" fill="rgba(255,255,255,0.8)" font-size="11">Khách đang chọn món</text>
            <text x="14" y="74" fill="#F59E0B" font-size="11">Đang duyệt giỏ...</text>
            <rect x="14" y="90" width="152" height="26" rx="4" fill="rgba(245,158,11,0.15)"/>
            <text x="44" y="107" fill="#F59E0B" font-size="10.5">Xem giỏ QR</text>
          </g>

          <!-- Table 04: Available -->
          <g transform="translate(585, 0)">
            <rect width="180" height="130" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.35)" stroke-width="1.5"/>
            <text x="14" y="26" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="900">T1-04</text>
            <rect x="110" y="12" width="56" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
            <text x="118" y="25" fill="#10B981" font-size="9.5" font-weight="700">Trống</text>
            <text x="14" y="52" fill="rgba(255,255,255,0.6)" font-size="11">4 Chỗ · Bàn vuông</text>
            <text x="14" y="74" fill="#16C9F6" font-size="11">Mã QR: Sẵn sàng</text>
            <rect x="14" y="90" width="152" height="26" rx="4" fill="rgba(255,255,255,0.04)"/>
            <text x="44" y="107" fill="rgba(255,255,255,0.7)" font-size="10.5">In mã QR ↗</text>
          </g>

          <!-- Row 2 (T1-05 -> T1-08) -->
          <g transform="translate(0, 145)">
            <!-- Table 05 -->
            <g transform="translate(0, 0)">
              <rect width="180" height="130" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.35)"/>
              <text x="14" y="26" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="900">T1-05</text>
              <text x="14" y="52" fill="rgba(255,255,255,0.6)" font-size="11">4 Chỗ · Trống</text>
              <rect x="14" y="90" width="152" height="26" rx="4" fill="rgba(255,255,255,0.04)"/>
              <text x="44" y="107" fill="rgba(255,255,255,0.7)" font-size="10.5">In mã QR ↗</text>
            </g>

            <!-- Table 06 -->
            <g transform="translate(195, 0)">
              <rect width="180" height="130" rx="10" fill="rgba(124,106,238,0.12)" stroke="rgba(124,106,238,0.5)"/>
              <text x="14" y="26" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="900">T1-06</text>
              <text x="14" y="52" fill="rgba(255,255,255,0.8)" font-size="11">Có khách · 2 người</text>
              <text x="14" y="74" fill="#10B981" font-size="11.5" font-weight="700">Đơn: 95.000 đ</text>
              <rect x="14" y="90" width="152" height="26" rx="4" fill="rgba(124,106,238,0.2)"/>
              <text x="40" y="107" fill="#7C6AEE" font-size="10.5" font-weight="700">Xem đơn bàn</text>
            </g>

            <!-- Table 07 -->
            <g transform="translate(390, 0)">
              <rect width="180" height="130" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.35)"/>
              <text x="14" y="26" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="900">T1-07</text>
              <text x="14" y="52" fill="rgba(255,255,255,0.6)" font-size="11">4 Chỗ · Trống</text>
              <rect x="14" y="90" width="152" height="26" rx="4" fill="rgba(255,255,255,0.04)"/>
              <text x="44" y="107" fill="rgba(255,255,255,0.7)" font-size="10.5">In mã QR ↗</text>
            </g>

            <!-- Table 08 -->
            <g transform="translate(585, 0)">
              <rect width="180" height="130" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.35)"/>
              <text x="14" y="26" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="900">T1-08</text>
              <text x="14" y="52" fill="rgba(255,255,255,0.6)" font-size="11">4 Chỗ · Trống</text>
              <rect x="14" y="90" width="152" height="26" rx="4" fill="rgba(255,255,255,0.04)"/>
              <text x="44" y="107" fill="rgba(255,255,255,0.7)" font-size="10.5">In mã QR ↗</text>
            </g>
          </g>

          <!-- Row 3: Hint for remaining tables T1-09 -> T1-16 -->
          <g transform="translate(0, 290)">
            <rect width="765" height="180" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
            <text x="24" y="32" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="13" font-weight="700">CÁC BÀN TIẾP THEO TRONG DẢI: T1-09, T1-10, T1-11, T1-12, T1-13, T1-14, T1-15, T1-16</text>
            <text x="24" y="58" fill="rgba(255,255,255,0.5)" font-size="11.5">Trạng thái: 8 bàn trống sẵn sàng đón khách hoặc ghép bàn tiệc lớn.</text>
            
            <g transform="translate(24, 80)">
              <rect width="180" height="34" rx="6" fill="rgba(124,106,238,0.15)" stroke="rgba(124,106,238,0.3)"/>
              <text x="28" y="102" fill="#7C6AEE" font-size="11.5" font-weight="700">Ghép bàn (Merge Table)</text>

              <rect x="195" y="0" width="180" height="34" rx="6" fill="rgba(22,201,246,0.15)" stroke="rgba(22,201,246,0.3)"/>
              <text x="220" y="22" fill="#16C9F6" font-size="11.5" font-weight="700">Tải bộ mã 16 QR ↗</text>

              <rect x="390" y="0" width="180" height="34" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
              <text x="424" y="22" fill="rgba(255,255,255,0.7)" font-size="11.5">Chuyển khu vực</text>
            </g>
          </g>
