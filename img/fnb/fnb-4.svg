<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ui4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="100%" stop-color="#080A10"/>
    </linearGradient>
    <linearGradient id="card-grad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B26"/>
      <stop offset="100%" stop-color="#111520"/>
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6AEE"/>
      <stop offset="100%" stop-color="#5B45E0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg-ui4)"/>

  <!-- Left Sidebar (Admin Navigation) -->
  <g transform="translate(0, 0)">
    <rect width="260" height="1000" fill="#0B0E17" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Logo -->
    <g transform="translate(24, 28)">
      <circle cx="16" cy="16" r="14" fill="url(#accent-purple)"/>
      <text x="16" y="21" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" text-anchor="middle">S</text>
      <text x="40" y="22" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">SOLPOS</text>
      <text x="110" y="22" fill="#16C9F6" font-family="monospace" font-size="11" font-weight="700">F&amp;B</text>
    </g>

    <!-- Nav Items -->
    <g transform="translate(16, 90)">
      <text x="12" y="0" fill="rgba(255,255,255,0.35)" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">QUẢN TRỊ F&amp;B</text>
      
      <!-- Product -->
      <g transform="translate(0, 16)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">🍔</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Sản phẩm &amp; Món</text>
      </g>

      <!-- Modifier Groups -->
      <g transform="translate(0, 64)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">⚡</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Nhóm tùy chọn (Mod)</text>
      </g>

      <!-- Menu Management -->
      <g transform="translate(0, 112)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">📋</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Thực đơn theo giờ</text>
      </g>

      <!-- Active: Room & Table -->
      <g transform="translate(0, 160)">
        <rect width="228" height="40" rx="8" fill="rgba(16,185,129,0.18)" stroke="rgba(16,185,129,0.4)"/>
        <text x="16" y="25" fill="#10B981" font-size="16">🪑</text>
        <text x="44" y="25" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Khu vực &amp; Bàn</text>
        <circle cx="210" cy="20" r="3" fill="#10B981"/>
      </g>

      <!-- QR Order -->
      <g transform="translate(0, 208)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">📱</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Quản lý QR Order</text>
      </g>
    </g>
  </g>

  <!-- Top Bar -->
  <g transform="translate(260, 0)">
    <rect width="1340" height="70" fill="#0E121B" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="32" y="40" fill="rgba(255,255,255,0.5)" font-family="-apple-system, sans-serif" font-size="13">Không gian phục vụ / </text>
    <text x="180" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Chi nhánh Quận 1 · Tầng 1 Sảnh Chính (16 Bàn)</text>

    <!-- Branch Picker -->
    <rect x="940" y="18" width="180" height="34" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.15)"/>
    <text x="955" y="40" fill="#FFFFFF" font-size="12">📍 Chi nhánh Quận 1 ▼</text>

    <rect x="1140" y="18" width="170" height="34" rx="6" fill="url(#accent-green)"/>
    <text x="1160" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700">+ Tạo bàn hàng loạt</text>
  </g>

  <!-- Main Body -->
  <g transform="translate(292, 94)">
    <text x="0" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">Quản lý Khu Vực &amp; Bàn (Room &amp; Table Setup)</text>
    <text x="0" y="52" fill="rgba(255,255,255,0.55)" font-family="-apple-system, sans-serif" font-size="13.5">Tạo bàn đơn lẻ hoặc tạo nhanh dải bàn hàng loạt, phân loại theo tầng/khu vực và xem trước sơ đồ thực tế.</text>

    <!-- Zone Tabs -->
    <g transform="translate(0, 75)">
      <rect width="530" height="36" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <rect x="4" y="4" width="170" height="28" rx="6" fill="url(#accent-green)"/>
      <text x="18" y="23" fill="#FFFFFF" font-size="11.5" font-weight="700">Tầng 1 - Sảnh chính (16)</text>
      <text x="190" y="23" fill="rgba(255,255,255,0.7)" font-size="11.5">Tầng 2 - Ban công (8)</text>
      <text x="340" y="23" fill="rgba(255,255,255,0.7)" font-size="11.5">Phòng VIP Hoa Sen (4)</text>
      <text x="495" y="23" fill="#16C9F6" font-size="13">+</text>
    </g>

    <!-- 2 Column Layout: Batch Creator (430px) & Floor Plan Grid (830px) -->
    <g transform="translate(0, 130)">
      
      <!-- LEFT: Batch Creator Panel -->
      <g>
        <rect width="440" height="660" rx="12" fill="url(#card-grad4)" stroke="rgba(16,185,129,0.3)"/>
        <rect width="440" height="42" rx="12" fill="rgba(16,185,129,0.1)"/>
        <text x="20" y="26" fill="#10B981" font-family="monospace" font-size="11" font-weight="800">CÔNG CỤ: TẠO DẢI BÀN HÀNG LOẠT (BATCH SETUP)</text>

        <g transform="translate(20, 60)">
          <!-- Zone select -->
          <text x="0" y="14" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Khu vực phục vụ</text>
          <rect x="0" y="24" width="400" height="36" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)"/>
          <text x="14" y="47" fill="#FFFFFF" font-size="13">Tầng 1 - Sảnh chính (Trong nhà)</text>

          <!-- Table Type -->
          <text x="0" y="86" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Loại bàn &amp; Số ghế</text>
          <rect x="0" y="96" width="400" height="36" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)"/>
          <text x="14" y="119" fill="#FFFFFF" font-size="13">Bàn 4 người tiêu chuẩn (Bàn vuông)</text>

          <!-- Prefix & Count -->
