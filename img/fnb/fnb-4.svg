            <rect width="400" height="110" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)"/>
            <text x="14" y="24" fill="#FFFFFF" font-size="12" font-weight="700">ĐIỂM NHẤN UX</text>
            <text x="14" y="46" fill="rgba(255,255,255,0.7)" font-size="11.5">● Tạo nhanh hàng chục bàn chỉ với 1 cú click.</text>
            <text x="14" y="68" fill="rgba(255,255,255,0.7)" font-size="11.5">● Xem trước trực quan sơ đồ bên phải trước khi lưu.</text>
            <text x="14" y="90" fill="rgba(255,255,255,0.7)" font-size="11.5">● Tránh đặt tên trùng lặp giữa các tầng.</text>
