            <text x="0" y="14" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Tiền tố tên bàn (Prefix)</text>
            <rect x="0" y="24" width="190" height="36" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)"/>
            <text x="14" y="47" fill="#16C9F6" font-family="monospace" font-size="13" font-weight="800">T1-</text>

            <text x="210" y="14" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Số lượng bàn</text>
            <rect x="210" y="24" width="190" height="36" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)"/>
            <text x="224" y="47" fill="#10B981" font-family="monospace" font-size="13" font-weight="800">16</text>
          </g>

