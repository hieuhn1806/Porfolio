            <rect width="400" height="74" rx="8" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)"/>
            <text x="14" y="24" fill="#10B981" font-size="11" font-weight="700">DẢI TÊN BÀN SẼ TỰ ĐỘNG TẠO:</text>
            <text x="14" y="48" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="800">T1-01  →  T1-16  (16 BÀN)</text>
            <text x="14" y="66" fill="rgba(255,255,255,0.5)" font-size="10.5">Mỗi bàn sẽ được cấp 1 mã QR gọi món riêng biệt</text>
          </g>

