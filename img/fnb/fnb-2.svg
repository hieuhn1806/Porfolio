<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ui2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="100%" stop-color="#080A10"/>
    </linearGradient>
    <linearGradient id="card-grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B26"/>
      <stop offset="100%" stop-color="#111520"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16C9F6"/>
      <stop offset="100%" stop-color="#0D6FF0"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6AEE"/>
      <stop offset="100%" stop-color="#5B45E0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg-ui2)"/>

  <!-- Left Sidebar (Admin Navigation) -->
  <g transform="translate(0, 0)">
    <rect width="260" height="1000" fill="#0B0E17" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- App Logo -->
    <g transform="translate(24, 28)">
      <circle cx="16" cy="16" r="14" fill="url(#accent-purple)"/>
      <text x="16" y="21" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" text-anchor="middle">S</text>
      <text x="40" y="22" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">SOLPOS</text>
      <text x="110" y="22" fill="#16C9F6" font-family="monospace" font-size="11" font-weight="700">F&amp;B</text>
    </g>

    <!-- Nav Items -->
    <g transform="translate(16, 90)">
      <text x="12" y="0" fill="rgba(255,255,255,0.35)" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">QUẢN TRỊ F&amp;B</text>
      
      <!-- Product -->
      <g transform="translate(0, 16)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">🍔</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Sản phẩm &amp; Món</text>
      </g>

      <!-- Active: Modifier Groups -->
      <g transform="translate(0, 64)">
        <rect width="228" height="40" rx="8" fill="rgba(22,201,246,0.18)" stroke="rgba(22,201,246,0.4)"/>
        <text x="16" y="25" fill="#16C9F6" font-size="16">⚡</text>
        <text x="44" y="25" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Nhóm tùy chọn (Mod)</text>
        <circle cx="210" cy="20" r="3" fill="#16C9F6"/>
      </g>

      <!-- Menu Management -->
      <g transform="translate(0, 112)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">📋</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Thực đơn theo giờ</text>
      </g>

      <!-- Room & Table -->
      <g transform="translate(0, 160)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">🪑</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Khu vực &amp; Bàn</text>
      </g>

      <!-- QR Order -->
      <g transform="translate(0, 208)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">📱</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Quản lý QR Order</text>
      </g>
    </g>
  </g>

  <!-- Top Bar -->
  <g transform="translate(260, 0)">
    <rect width="1340" height="70" fill="#0E121B" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="32" y="40" fill="rgba(255,255,255,0.5)" font-family="-apple-system, sans-serif" font-size="13">Nhóm tùy chọn / </text>
    <text x="150" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Topping Trà Sữa &amp; Cà Phê (MOD-TOPPING-01)</text>

    <!-- Save CTA -->
    <rect x="1175" y="18" width="135" height="34" rx="6" fill="url(#accent-cyan)"/>
    <text x="1195" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700">Lưu nhóm tùy chọn</text>
  </g>

  <!-- Main Body -->
  <g transform="translate(292, 94)">
    <text x="0" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">Quản lý Nhóm Tùy Chọn (Modifier Groups)</text>
    <text x="0" y="52" fill="rgba(255,255,255,0.55)" font-family="-apple-system, sans-serif" font-size="13.5">Cấu hình số lựa chọn tối thiểu/tối đa, danh mục topping/mức đường, và kiểm tra phạm vi ảnh hưởng trước khi cập nhật.</text>

    <!-- 2 Column Layout: Editor (800px) & Blast Radius Impact (460px) -->
    <g transform="translate(0, 80)">
      
      <!-- LEFT: General Settings & Constraints & Options Table -->
      <g>
        <!-- Card 1: Master Rule & Min/Max Constraints -->
        <rect width="780" height="190" rx="12" fill="url(#card-grad2)" stroke="rgba(255,255,255,0.1)"/>
        <rect width="780" height="40" rx="12" fill="rgba(255,255,255,0.03)"/>
        <text x="20" y="25" fill="#16C9F6" font-family="monospace" font-size="11" font-weight="800">QUY TẮC CHỌN (SELECTION CONSTRAINTS)</text>

        <g transform="translate(20, 56)">
          <!-- Group Name -->
          <text x="0" y="14" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Tên nhóm tùy chọn *</text>
          <rect x="0" y="24" width="360" height="36" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)"/>
          <text x="14" y="47" fill="#FFFFFF" font-size="13">Topping Trà Sữa &amp; Cà Phê</text>

          <!-- Type -->
          <text x="380" y="14" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Kiểu lựa chọn</text>
          <rect x="380" y="24" width="360" height="36" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)"/>
          <text x="394" y="47" fill="#FFFFFF" font-size="13">Được chọn nhiều món (Multiple Checkboxes)</text>

          <!-- Min selection -->
          <g transform="translate(0, 74)">
            <text x="0" y="14" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Tối thiểu (Min) *</text>
            <rect x="0" y="24" width="160" height="34" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)"/>
            <text x="14" y="46" fill="#10B981" font-family="monospace" font-size="13" font-weight="700">0 (Không bắt buộc)</text>

            <text x="180" y="14" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Tối đa (Max) *</text>
            <rect x="180" y="24" width="160" height="34" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)"/>
            <text x="194" y="46" fill="#16C9F6" font-family="monospace" font-size="13" font-weight="700">3 (Tối đa 3 loại)</text>

            <text x="360" y="14" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Trùng lặp tùy chọn</text>
            <rect x="360" y="24" width="380" height="34" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
            <circle cx="380" cy="41" r="7" fill="rgba(255,255,255,0.2)"/>
            <text x="400" y="45" fill="rgba(255,255,255,0.7)" font-size="12">Không cho phép chọn 2 phần giống nhau</text>
          </g>
        </g>

        <!-- Card 2: Options Table with Cost and Inventory -->
        <g transform="translate(0, 210)">
          <rect width="780" height="490" rx="12" fill="url(#card-grad2)" stroke="rgba(255,255,255,0.1)"/>
          <rect width="780" height="40" rx="12" fill="rgba(255,255,255,0.03)"/>
          <text x="20" y="25" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800">DANH SÁCH TÙY CHỌN &amp; ĐƠN GIÁ BÁN THÊM (4 TOPPINGS)</text>
          <text x="660" y="25" fill="#16C9F6" font-size="11" font-weight="700">+ Thêm tùy chọn</text>

          <!-- Table Header -->
          <g transform="translate(20, 56)">
            <rect width="740" height="30" rx="4" fill="rgba(255,255,255,0.03)"/>
            <text x="14" y="20" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10.5">TÊN TOPPING / OPTION</text>
            <text x="240" y="20" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10.5">GIÁ BÁN THÊM</text>
            <text x="370" y="20" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10.5">GIÁ VỐN</text>
            <text x="480" y="20" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10.5">TRỪ KHO NGUYÊN LIỆU</text>
            <text x="640" y="20" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10.5">TRẠNG THÁI</text>

            <!-- Row 1: Trân châu hoàng kim -->
            <g transform="translate(0, 38)">
              <rect width="740" height="52" rx="6" fill="rgba(255,255,255,0.02)"/>
              <text x="14" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Trân châu hoàng kim</text>
              <text x="14" y="40" fill="rgba(255,255,255,0.45)" font-size="10.5">Mã: TOP-TC-HK</text>
              <text x="240" y="32" fill="#10B981" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">+10.000 đ</text>
              <text x="370" y="32" fill="rgba(255,255,255,0.7)" font-size="12.5">2.500 đ</text>
              <text x="480" y="32" fill="#16C9F6" font-family="monospace" font-size="12">30g Trân châu khô</text>
              <rect x="640" y="16" width="76" height="22" rx="4" fill="rgba(16,185,129,0.15)"/>
              <text x="652" y="31" fill="#10B981" font-size="10.5" font-weight="700">Sẵn hàng</text>
            </g>

            <!-- Row 2: Thạch phô mai -->
            <g transform="translate(0, 98)">
              <rect width="740" height="52" rx="6" fill="rgba(255,255,255,0.02)"/>
              <text x="14" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Thạch phô mai tươi</text>
              <text x="14" y="40" fill="rgba(255,255,255,0.45)" font-size="10.5">Mã: TOP-TPM-01</text>
              <text x="240" y="32" fill="#10B981" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">+12.000 đ</text>
              <text x="370" y="32" fill="rgba(255,255,255,0.7)" font-size="12.5">3.200 đ</text>
              <text x="480" y="32" fill="#16C9F6" font-family="monospace" font-size="12">2 viên Thạch phô mai</text>
              <rect x="640" y="16" width="76" height="22" rx="4" fill="rgba(16,185,129,0.15)"/>
              <text x="652" y="31" fill="#10B981" font-size="10.5" font-weight="700">Sẵn hàng</text>
            </g>

            <!-- Row 3: Kem Cheese nướng -->
            <g transform="translate(0, 158)">
              <rect width="740" height="52" rx="6" fill="rgba(255,255,255,0.02)"/>
              <text x="14" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Kem Cheese Macchiato</text>
              <text x="14" y="40" fill="rgba(255,255,255,0.45)" font-size="10.5">Mã: TOP-KC-MC</text>
              <text x="240" y="32" fill="#10B981" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">+15.000 đ</text>
              <text x="370" y="32" fill="rgba(255,255,255,0.7)" font-size="12.5">4.000 đ</text>
              <text x="480" y="32" fill="#16C9F6" font-family="monospace" font-size="12">50ml Kem béo</text>
              <rect x="640" y="16" width="76" height="22" rx="4" fill="rgba(245,158,11,0.15)"/>
              <text x="650" y="31" fill="#F59E0B" font-size="10.5" font-weight="700">Sắp hết kho</text>
            </g>

            <!-- Row 4: Pudding Trứng -->
            <g transform="translate(0, 218)">
              <rect width="740" height="52" rx="6" fill="rgba(255,255,255,0.02)"/>
              <text x="14" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Pudding Trứng</text>
              <text x="14" y="40" fill="rgba(255,255,255,0.45)" font-size="10.5">Mã: TOP-PD-TR</text>
              <text x="240" y="32" fill="#10B981" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">+10.000 đ</text>
              <text x="370" y="32" fill="rgba(255,255,255,0.7)" font-size="12.5">2.800 đ</text>
              <text x="480" y="32" fill="#16C9F6" font-family="monospace" font-size="12">1 hũ Pudding</text>
              <rect x="640" y="16" width="76" height="22" rx="4" fill="rgba(239,68,68,0.15)"/>
              <text x="652" y="31" fill="#EF4444" font-size="10.5" font-weight="700">Tạm hết</text>
            </g>
          </g>
        </g>
      </g>

      <!-- RIGHT: UX Highlight Card — BLAST RADIUS & LINKED DISHES -->
      <g transform="translate(805, 0)">
        
        <!-- Blast Radius Card -->
        <rect width="470" height="700" rx="12" fill="url(#card-grad2)" stroke="rgba(124,106,238,0.3)"/>
        
        <rect width="470" height="42" rx="12" fill="rgba(124,106,238,0.12)"/>
        <text x="20" y="26" fill="#7C6AEE" font-family="monospace" font-size="11" font-weight="800">UX HIGHLIGHT: PHẠM VI ẢNH HƯỞNG (BLAST RADIUS)</text>

        <!-- Scope Banner Alert -->
        <g transform="translate(20, 56)">
          <rect width="430" height="84" rx="8" fill="rgba(124,106,238,0.12)" stroke="rgba(124,106,238,0.3)"/>
          <circle cx="28" cy="28" r="10" fill="#7C6AEE"/>
          <text x="28" y="33" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">i</text>
          <text x="48" y="26" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700">Đang áp dụng cho 14 món ăn &amp; đồ uống</text>
          <text x="48" y="44" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="11">Bất kỳ điều chỉnh về giá hoặc ẩn/hiện topping tại đây sẽ cập nhật ngay lập tức xuống 5 chi nhánh cửa hàng và menu gọi món QR.</text>
        </g>

        <!-- Impact Stats -->
        <g transform="translate(20, 156)">
          <rect width="136" height="64" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
          <text x="14" y="24" fill="rgba(255,255,255,0.5)" font-size="10.5">MÓN LIÊN KẾT</text>
          <text x="14" y="48" fill="#7C6AEE" font-size="20" font-weight="800">14 Món</text>

          <g transform="translate(146, 0)">
            <rect width="136" height="64" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
            <text x="14" y="24" fill="rgba(255,255,255,0.5)" font-size="10.5">THỰC ĐƠN LIÊN KẾT</text>
            <text x="14" y="48" fill="#16C9F6" font-size="20" font-weight="800">3 Menu</text>
          </g>

          <g transform="translate(292, 0)">
            <rect width="136" height="64" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
            <text x="14" y="24" fill="rgba(255,255,255,0.5)" font-size="10.5">CHI NHÁNH LIVE</text>
            <text x="14" y="48" fill="#10B981" font-size="20" font-weight="800">5 Cửa hàng</text>
          </g>
        </g>

        <!-- Linked Dishes List -->
        <g transform="translate(20, 236)">
          <text x="0" y="14" fill="rgba(255,255,255,0.6)" font-size="11" font-weight="700">DANH SÁCH MÓN ĐANG SỬ DỤNG NHÓM NÀY:</text>
          
          <!-- Dish 1 -->
          <g transform="translate(0, 26)">
            <rect width="430" height="42" rx="6" fill="rgba(255,255,255,0.03)"/>
            <text x="12" y="26" fill="#FFFFFF" font-size="12" font-weight="600">Trà Sữa Ô Long Nướng</text>
            <text x="240" y="26" fill="rgba(255,255,255,0.5)" font-size="11">Menu Trưa · Toàn chuỗi</text>
            <text x="390" y="26" fill="#10B981" font-size="12">Live ↗</text>
          </g>

          <!-- Dish 2 -->
          <g transform="translate(0, 76)">
            <rect width="430" height="42" rx="6" fill="rgba(255,255,255,0.03)"/>
            <text x="12" y="26" fill="#FFFFFF" font-size="12" font-weight="600">Hồng Trà Sữa Đài Loan</text>
            <text x="240" y="26" fill="rgba(255,255,255,0.5)" font-size="11">Menu Tiêu Chuẩn</text>
            <text x="390" y="26" fill="#10B981" font-size="12">Live ↗</text>
          </g>

          <!-- Dish 3 -->
          <g transform="translate(0, 126)">
            <rect width="430" height="42" rx="6" fill="rgba(255,255,255,0.03)"/>
            <text x="12" y="26" fill="#FFFFFF" font-size="12" font-weight="600">Cà Phê Muối Kem Béo</text>
            <text x="240" y="26" fill="rgba(255,255,255,0.5)" font-size="11">Menu Sáng &amp; Trưa</text>
            <text x="390" y="26" fill="#10B981" font-size="12">Live ↗</text>
          </g>

          <!-- Dish 4 -->
          <g transform="translate(0, 176)">
            <rect width="430" height="42" rx="6" fill="rgba(255,255,255,0.03)"/>
            <text x="12" y="26" fill="#FFFFFF" font-size="12" font-weight="600">Matcha Latte Nhật Bản</text>
            <text x="240" y="26" fill="rgba(255,255,255,0.5)" font-size="11">Menu Tiêu Chuẩn</text>
            <text x="390" y="26" fill="#10B981" font-size="12">Live ↗</text>
          </g>

          <!-- Dish 5 -->
          <g transform="translate(0, 226)">
            <rect width="430" height="42" rx="6" fill="rgba(255,255,255,0.03)"/>
            <text x="12" y="26" fill="#FFFFFF" font-size="12" font-weight="600">Trà Đào Cam Sả</text>
            <text x="240" y="26" fill="rgba(255,255,255,0.5)" font-size="11">Menu Giải Khát</text>
            <text x="390" y="26" fill="#10B981" font-size="12">Live ↗</text>
          </g>

          <!-- View all -->
          <text x="0" y="295" fill="#7C6AEE" font-size="12" font-weight="700">Xem thêm 9 món khác đang liên kết...</text>
        </g>
      </g>
    </g>
  </g>
</svg>
