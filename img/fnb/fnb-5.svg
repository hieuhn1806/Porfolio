<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ui5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="100%" stop-color="#080A10"/>
    </linearGradient>
    <linearGradient id="card-grad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B26"/>
      <stop offset="100%" stop-color="#111520"/>
    </linearGradient>
    <linearGradient id="accent-cyan5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16C9F6"/>
      <stop offset="100%" stop-color="#0D6FF0"/>
    </linearGradient>
    <linearGradient id="accent-purple5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6AEE"/>
      <stop offset="100%" stop-color="#5B45E0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg-ui5)"/>

  <!-- Left Sidebar (Admin Navigation) -->
  <g transform="translate(0, 0)">
    <rect width="260" height="1000" fill="#0B0E17" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Logo -->
    <g transform="translate(24, 28)">
      <circle cx="16" cy="16" r="14" fill="url(#accent-purple5)"/>
      <text x="16" y="21" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" text-anchor="middle">S</text>
      <text x="40" y="22" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">SOLPOS</text>
      <text x="110" y="22" fill="#16C9F6" font-family="monospace" font-size="11" font-weight="700">F&amp;B</text>
    </g>

    <!-- Nav Items -->
    <g transform="translate(16, 90)">
      <text x="12" y="0" fill="rgba(255,255,255,0.35)" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">QUẢN TRỊ F&amp;B</text>
      
      <!-- Product -->
      <g transform="translate(0, 16)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">🍔</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Sản phẩm &amp; Món</text>
      </g>

      <!-- Modifier Groups -->
      <g transform="translate(0, 64)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">⚡</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Nhóm tùy chọn (Mod)</text>
      </g>

      <!-- Menu Management -->
      <g transform="translate(0, 112)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">📋</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Thực đơn theo giờ</text>
      </g>

      <!-- Room & Table -->
      <g transform="translate(0, 160)">
        <text x="16" y="25" fill="rgba(255,255,255,0.6)" font-size="16">🪑</text>
        <text x="44" y="25" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13.5">Khu vực &amp; Bàn</text>
      </g>

      <!-- Active: QR Order -->
      <g transform="translate(0, 208)">
        <rect width="228" height="40" rx="8" fill="rgba(22,201,246,0.18)" stroke="rgba(22,201,246,0.4)"/>
        <text x="16" y="25" fill="#16C9F6" font-size="16">📱</text>
        <text x="44" y="25" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Quản lý QR Order</text>
        <circle cx="210" cy="20" r="3" fill="#16C9F6"/>
      </g>
    </g>
  </g>

  <!-- Top Bar -->
  <g transform="translate(260, 0)">
    <rect width="1340" height="70" fill="#0E121B" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="32" y="40" fill="rgba(255,255,255,0.5)" font-family="-apple-system, sans-serif" font-size="13">Gọi món thông minh / </text>
    <text x="195" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Trung Tâm Quản Lý Mã QR Tại Bàn (Dine-In QR)</text>

    <!-- Master Switch Live -->
    <rect x="940" y="20" width="165" height="30" rx="15" fill="rgba(16,185,129,0.15)" stroke="#10B981"/>
    <circle cx="956" cy="35" r="4" fill="#10B981"/>
    <text x="968" y="39" fill="#10B981" font-size="11.5" font-weight="700">Đang nhận đơn QR</text>

    <!-- Download Batch QR -->
    <rect x="1120" y="18" width="190" height="34" rx="6" fill="url(#accent-cyan5)"/>
    <text x="1136" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700">Tải bộ mã in ấn (PDF) ↗</text>
  </g>

  <!-- Main Body -->
  <g transform="translate(292, 94)">
    <text x="0" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">Quản lý Đặt Món Qua QR Tại Bàn (QR Order)</text>
    <text x="0" y="52" fill="rgba(255,255,255,0.55)" font-family="-apple-system, sans-serif" font-size="13.5">Kết nối phần thiết lập bàn và thực đơn với cách khách hàng bắt đầu gọi món không chạm tại từng vị trí ngồi.</text>

    <!-- 2 Column Layout: Settings & Menu Bridge (520px) | Standee Mockup & Live Status (740px) -->
    <g transform="translate(0, 80)">
      
      <!-- LEFT: QR Settings & Menu Bridge -->
      <g>
        <rect width="510" height="710" rx="12" fill="url(#card-grad5)" stroke="rgba(255,255,255,0.1)"/>
        
        <rect width="510" height="42" rx="12" fill="rgba(255,255,255,0.03)"/>
        <text x="20" y="26" fill="#16C9F6" font-family="monospace" font-size="11" font-weight="800">CẤU HÌNH LIÊN KẾT THỰC ĐƠN VỚI MÃ BÀN</text>

        <g transform="translate(20, 56)">
          <!-- Dynamic URL Routing -->
          <text x="0" y="16" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Định dạng đường dẫn QR gọi món</text>
          <rect x="0" y="26" width="470" height="40" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)"/>
          <text x="14" y="51" fill="#16C9F6" font-family="monospace" font-size="12.5">https://menu.solpos.vn/order?table=T1-04&amp;b=q1</text>

          <!-- Linked Active Menu -->
          <g transform="translate(0, 82)">
            <text x="0" y="16" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Thực đơn áp dụng cho khách quét mã</text>
            <rect x="0" y="26" width="470" height="42" rx="6" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.3)"/>
            <text x="14" y="52" fill="#FFFFFF" font-size="13" font-weight="700">Tự động theo giờ (Auto Day-parting)</text>
            <rect x="330" y="34" width="124" height="24" rx="4" fill="rgba(245,158,11,0.2)"/>
            <text x="340" y="50" fill="#F59E0B" font-size="10.5" font-weight="700">Đang: Menu Trưa</text>
          </g>

          <!-- Guest Permissions Toggles -->
          <g transform="translate(0, 165)">
            <text x="0" y="16" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600">Quyền hạn &amp; Trải nghiệm khách tại bàn</text>

            <!-- Toggle 1: Send to Kitchen -->
            <g transform="translate(0, 26)">
              <rect width="470" height="50" rx="6" fill="rgba(255,255,255,0.03)"/>
              <circle cx="25" cy="25" r="9" fill="#10B981"/>
              <text x="21" y="29" fill="#FFFFFF" font-size="11" font-weight="bold">✓</text>
              <text x="45" y="23" fill="#FFFFFF" font-size="12.5" font-weight="600">Tự động bắn đơn xuống bếp / bar</text>
              <text x="45" y="40" fill="rgba(255,255,255,0.45)" font-size="10.5">Khách xác nhận giỏ → In phiếu bếp tức thời</text>
            </g>

            <!-- Toggle 2: Call Waiter -->
            <g transform="translate(0, 84)">
              <rect width="470" height="50" rx="6" fill="rgba(255,255,255,0.03)"/>
              <circle cx="25" cy="25" r="9" fill="#10B981"/>
              <text x="21" y="29" fill="#FFFFFF" font-size="11" font-weight="bold">✓</text>
              <text x="45" y="23" fill="#FFFFFF" font-size="12.5" font-weight="600">Nút "Gọi phục vụ" &amp; "Xin thêm nước đá"</text>
              <text x="45" y="40" fill="rgba(255,255,255,0.45)" font-size="10.5">Báo rung đồng hồ hoặc tablet của nhân viên</text>
            </g>

            <!-- Toggle 3: Request E-invoice -->
            <g transform="translate(0, 142)">
              <rect width="470" height="50" rx="6" fill="rgba(255,255,255,0.03)"/>
              <circle cx="25" cy="25" r="9" fill="#10B981"/>
              <text x="21" y="29" fill="#FFFFFF" font-size="11" font-weight="bold">✓</text>
              <text x="45" y="23" fill="#FFFFFF" font-size="12.5" font-weight="600">Điền thông tin xuất hóa đơn đỏ (VAT) tại bàn</text>
              <text x="45" y="40" fill="rgba(255,255,255,0.45)" font-size="10.5">Khách tự nhập MST, công ty, email nhận hóa đơn</text>
            </g>

            <!-- Toggle 4: Prepay -->
            <g transform="translate(0, 200)">
              <rect width="470" height="50" rx="6" fill="rgba(255,255,255,0.02)"/>
              <circle cx="25" cy="25" r="9" fill="rgba(255,255,255,0.15)"/>
              <text x="45" y="23" fill="rgba(255,255,255,0.6)" font-size="12.5">Bắt buộc thanh toán trước qua VietQR/Momo</text>
              <text x="45" y="40" fill="rgba(255,255,255,0.4)" font-size="10.5">Đang tắt: Khách dùng bữa xong mới thanh toán</text>
            </g>
          </g>

          <!-- UX Highlight Card -->
          <g transform="translate(0, 435)">
            <rect width="470" height="135" rx="8" fill="rgba(124,106,238,0.1)" stroke="rgba(124,106,238,0.3)"/>
            <text x="16" y="24" fill="#7C6AEE" font-size="12" font-weight="700">ĐIỂM NHẤN UX</text>
            <text x="16" y="48" fill="rgba(255,255,255,0.8)" font-size="12">Kết nối chặt chẽ giữa 3 phần của hệ thống:</text>
            <text x="16" y="72" fill="#FFFFFF" font-size="12" font-weight="600">Thiết lập Bàn (04)  →  Thực đơn Giờ (03)  →  QR Bán hàng (05)</text>
            <text x="16" y="96" fill="rgba(255,255,255,0.65)" font-size="11.5">Giúp khách hàng tại chỗ tự trải nghiệm gọi món mượt mà, nhân viên quầy POS nhìn thấy giỏ hàng cập nhật theo thời gian thực.</text>
          </g>
        </g>
      </g>

      <!-- RIGHT: Physical Standee Preview & Realtime Table QR Monitoring -->
