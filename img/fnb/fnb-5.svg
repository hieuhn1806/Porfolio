              <text x="70" y="23" fill="#7C6AEE" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">BÀN T1-04</text>
            </g>

            <!-- Vector QR Code -->
            <g transform="translate(60, 102)">
              <rect width="150" height="150" fill="#0F172A" rx="8"/>
              <!-- Inner Corners -->
              <rect x="12" y="12" width="38" height="38" fill="#FFFFFF"/>
              <rect x="20" y="20" width="22" height="22" fill="#0F172A"/>
              
              <rect x="100" y="12" width="38" height="38" fill="#FFFFFF"/>
              <rect x="108" y="20" width="22" height="22" fill="#0F172A"/>

              <rect x="12" y="100" width="38" height="38" fill="#FFFFFF"/>
              <rect x="20" y="108" width="22" height="22" fill="#0F172A"/>

              <!-- Decorative QR data bits -->
              <rect x="58" y="20" width="12" height="12" fill="#FFFFFF"/>
              <rect x="76" y="32" width="14" height="14" fill="#FFFFFF"/>
              <rect x="58" y="112" width="14" height="14" fill="#FFFFFF"/>
              <rect x="76" y="100" width="14" height="14" fill="#FFFFFF"/>

              <circle cx="75" cy="75" r="14" fill="#7C6AEE"/>
              <text x="75" y="80" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">QR</text>
            </g>

            <text x="135" y="278" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">Mở camera điện thoại để đặt món</text>
          </g>

          <!-- Right side: Realtime Live Status of Orders placed via QR -->
          <g transform="translate(290, 0)">
            <rect width="410" height="300" rx="10" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)"/>
            <text x="16" y="26" fill="#16C9F6" font-size="12" font-weight="800">TRẠNG THÁI GỌI MÓN QUA QR (LIVE FEED)</text>

            <!-- Table 1 Feed -->
            <g transform="translate(16, 44)">
              <rect width="378" height="66" rx="6" fill="rgba(255,255,255,0.03)"/>
              <rect x="12" y="12" width="46" height="22" rx="4" fill="rgba(124,106,238,0.2)"/>
              <text x="18" y="27" fill="#7C6AEE" font-family="monospace" font-size="11" font-weight="800">T1-02</text>
              <text x="68" y="26" fill="#FFFFFF" font-size="12.5" font-weight="600">Khách vừa xác nhận thêm 2 món</text>
              <text x="68" y="44" fill="rgba(255,255,255,0.5)" font-size="11">1x Trà Đào Cam Sả, 1x Bánh Croissant · 11:24</text>
              <text x="320" y="26" fill="#10B981" font-size="11" font-weight="700">Đã gửi bếp</text>
            </g>

            <!-- Table 2 Feed -->
            <g transform="translate(16, 120)">
              <rect width="378" height="66" rx="6" fill="rgba(255,255,255,0.03)"/>
              <rect x="12" y="12" width="46" height="22" rx="4" fill="rgba(245,158,11,0.2)"/>
              <text x="18" y="27" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="800">T1-03</text>
              <text x="68" y="26" fill="#FFFFFF" font-size="12.5" font-weight="600">Khách đang chọn tùy chọn mức đường</text>
              <text x="68" y="44" fill="rgba(255,255,255,0.5)" font-size="11">Giỏ hàng tạm: 1x Trà Sữa Nướng (50% đường)</text>
              <text x="316" y="26" fill="#F59E0B" font-size="11">Đang chọn...</text>
            </g>

            <!-- Table 3 Feed -->
            <g transform="translate(16, 196)">
              <rect width="378" height="66" rx="6" fill="rgba(255,255,255,0.03)"/>
              <rect x="12" y="12" width="46" height="22" rx="4" fill="rgba(16,185,129,0.2)"/>
              <text x="18" y="27" fill="#10B981" font-family="monospace" font-size="11" font-weight="800">T1-04</text>
              <text x="68" y="26" fill="#FFFFFF" font-size="12.5" font-weight="600">Khách yêu cầu thanh toán &amp; Hóa đơn</text>
              <text x="68" y="44" fill="rgba(255,255,255,0.5)" font-size="11">Tổng tiền: 235.000 đ · Yêu cầu xuất VAT</text>
              <text x="310" y="26" fill="#16C9F6" font-size="11" font-weight="700">Chờ quầy POS</text>
            </g>
          </g>

          <!-- Bottom Management Bar (Actions for Q1 Branch) -->
          <g transform="translate(0, 320)">
            <rect width="700" height="290" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
            <text x="20" y="32" fill="#FFFFFF" font-size="13" font-weight="700">BẢNG ĐIỀU KHIỂN NHẬN ĐƠN THEO TỪNG BÀN (CHI NHÁNH QUẬN 1)</text>

            <!-- Mini Table list -->
            <g transform="translate(20, 52)">
              <rect width="660" height="30" rx="4" fill="rgba(255,255,255,0.03)"/>
              <text x="14" y="20" fill="rgba(255,255,255,0.4)" font-size="10.5">MÃ BÀN</text>
              <text x="110" y="20" fill="rgba(255,255,255,0.4)" font-size="10.5">TRẠNG THÁI QR</text>
              <text x="250" y="20" fill="rgba(255,255,255,0.4)" font-size="10.5">LẦN QUÉT GẦN NHẤT</text>
              <text x="420" y="20" fill="rgba(255,255,255,0.4)" font-size="10.5">TỔNG ĐƠN TẠI BÀN</text>
              <text x="560" y="20" fill="rgba(255,255,255,0.4)" font-size="10.5">THAO TÁC</text>

              <!-- Row 1 -->
              <g transform="translate(0, 38)">
                <text x="14" y="20" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">T1-01</text>
                <text x="110" y="20" fill="#10B981" font-size="11.5">● Đang mở</text>
                <text x="250" y="20" fill="rgba(255,255,255,0.6)" font-size="11">10:45 (Hôm nay)</text>
                <text x="420" y="20" fill="rgba(255,255,255,0.8)" font-size="11">0 đ (Trống)</text>
                <text x="560" y="20" fill="#EF4444" font-size="11">Tạm khóa ⏸</text>
              </g>

              <!-- Row 2 -->
              <g transform="translate(0, 78)">
                <text x="14" y="20" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">T1-02</text>
                <text x="110" y="20" fill="#10B981" font-size="11.5">● Đang mở</text>
                <text x="250" y="20" fill="rgba(255,255,255,0.6)" font-size="11">11:15 (Hôm nay)</text>
                <text x="420" y="20" fill="#10B981" font-size="11.5" font-weight="bold">185.000 đ</text>
                <text x="560" y="20" fill="#16C9F6" font-size="11">Xem đơn ↗</text>
              </g>

              <!-- Row 3 -->
              <g transform="translate(0, 118)">
                <text x="14" y="20" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">T1-03</text>
                <text x="110" y="20" fill="#10B981" font-size="11.5">● Đang mở</text>
                <text x="250" y="20" fill="rgba(255,255,255,0.6)" font-size="11">11:22 (Hôm nay)</text>
                <text x="420" y="20" fill="#F59E0B" font-size="11">Đang chọn món</text>
                <text x="560" y="20" fill="#16C9F6" font-size="11">Xem đơn ↗</text>
              </g>

              <!-- Row 4 -->
              <g transform="translate(0, 158)">
                <text x="14" y="20" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">T1-04</text>
                <text x="110" y="20" fill="#10B981" font-size="11.5">● Đang mở</text>
                <text x="250" y="20" fill="rgba(255,255,255,0.6)" font-size="11">11:05 (Hôm nay)</text>
                <text x="420" y="20" fill="#10B981" font-size="11.5" font-weight="bold">235.000 đ</text>
                <text x="560" y="20" fill="#7C6AEE" font-size="11">Thanh toán ↗</text>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
