        <rect width="740" height="710" rx="12" fill="url(#card-grad5)" stroke="rgba(255,255,255,0.1)"/>
        
        <rect width="740" height="42" rx="12" fill="rgba(255,255,255,0.03)"/>
        <text x="20" y="26" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800">THẺ MÃ QR ĐẶT BÀN &amp; THEO DÕI ĐƠN REAL-TIME</text>

        <g transform="translate(20, 60)">
          
          <!-- Top Row: Physical Standee Mockup (Left 280px) + Live Mobile Flow (Right 400px) -->
          <g>
            <!-- Physical Acrylic Tent Standee -->
            <rect width="270" height="300" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
            
            <!-- Brand Badge on Standee -->
